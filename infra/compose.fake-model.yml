# The fake-model overlay: the local stack without an Anthropic account, for
# `scripts/local.sh up --fake-model` over compose.yaml and the free runs
# over infra/compose.yml (tests/e2e/run.sh, quickstart, restore,
# gate and soak). It names no path, so it merges the same under either
# project directory.
#
# It turns on compose.local.yml's fake-messages and fake-mcp and has migrate
# import tests/fixtures/settings/fake-model.json, whose stored keys (a
# placeholder for the former, the latter's bearer, the fake App's key) the
# stack's starter sets once the first owner exists
# (scripts/lib/seed-credentials.sh). An empty SETTINGS_DOCUMENT
# imports nothing: an empty installation, set up in the console. Sessions
# follow the GATE-SPEC script in each prompt (docs/quickstart.md § 스크립트된
# 프롬프트).
services:
  fake-messages:
    profiles: !reset []
  fake-mcp:
    profiles: !reset []
  migrate:
    environment:
      SETTINGS_DOCUMENT: ${SETTINGS_DOCUMENT-/settings/fake-model.json}
  api:
    depends_on:
      fake-messages:
        condition: service_healthy
      fake-mcp:
        condition: service_healthy
