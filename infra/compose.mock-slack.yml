# Opt-in overlay: Sign in with Slack against a mock IdP
# (packages/testkit/src/mock-slack-oidc-main.ts, run from the control-host
# image), so linking a Slack account can be driven end to end without a
# Slack app. Consent is automatic and returns MOCK_SLACK_TEAM_ID and
# MOCK_SLACK_USER_ID, or the mock_team/mock_user query parameters added to
# the authorize URL. The issuer is only reachable inside the compose network.
# It accepts the client of any app the Web API fake below made (a
# workspace's link app). The same service fakes
# Slack's Web API for SLACK_API_URL (config token rotation, app manifests,
# oauth.v2.access); `POST http://mock-slack:4020/fake/config-tokens` returns
# a config token it accepts. Never layer this over a real deployment: the
# API would trust whatever the mock signs.
services:
  mock-slack:
    image: ${API_IMAGE:-werft-control-host:dev}
    profiles: ["apps"]
    # Built by the api service in the same `up --build`; never pulled.
    pull_policy: never
    command: ["bun", "run", "/app/packages/testkit/src/mock-slack-oidc-main.ts"]
    environment:
      MOCK_SLACK_PORT: "4020"
      MOCK_SLACK_PUBLIC_URL: http://mock-slack:4020
      MOCK_SLACK_TEAM_ID: ${MOCK_SLACK_TEAM_ID:-T0MOCK}
      MOCK_SLACK_USER_ID: ${MOCK_SLACK_USER_ID:-U0MOCK}
      # Empty: the id_token carries no names, as a link made before they
      # were kept shows.
      MOCK_SLACK_TEAM_NAME: ${MOCK_SLACK_TEAM_NAME:-}
      MOCK_SLACK_USER_NAME: ${MOCK_SLACK_USER_NAME:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:4020/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  api:
    environment:
      # Each workspace links with the link app it makes through the fake on
      # the first start. The issuer and API URL below are for this mock
      # only; an operational deployment never sets them.
      SLACK_OIDC_ISSUER: http://mock-slack:4020
      SLACK_API_URL: http://mock-slack:4020/api
      # The console as a browser on this host opens it; the redirect and
      # events addresses are computed from it.
      CONSOLE_ORIGIN: http://127.0.0.1:3000
    depends_on:
      mock-slack:
        condition: service_healthy
  slack:
    environment:
      CONSOLE_ORIGIN: http://127.0.0.1:3000
      SLACK_API_URL: http://mock-slack:4020/api
    depends_on:
      mock-slack:
        condition: service_healthy
