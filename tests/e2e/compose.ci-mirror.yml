# CI-only overlay: the `e2e` and `quickstart` jobs pull every
# third-party image of the compose stack from the CI mirror
# (ci-image-mirror.yml, docs/contributing/ci.md § 서드파티 이미지 미러) instead of Docker
# Hub, by the very digests infra/compose.core.yml, infra/compose.local.yml
# and the app Dockerfiles pin; the stack itself is unchanged. `e2e` passes it to tests/e2e/run.sh as
# E2E_COMPOSE_OVERRIDE, `quickstart` through COMPOSE_FILE so that
# docs/quickstart.md runs as written. tests/ci-images.test.ts holds every
# reference here to the compose file and the mirror list.
x-mirror-build-args: &mirror-build-args
  BUN_IMAGE: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
  # The Dockerfiles' `# syntax=docker/dockerfile:1.7`, which BuildKit would
  # otherwise fetch from Docker Hub.
  BUILDKIT_SYNTAX: ghcr.io/jeongjaesoon/werft-ci/dockerfile@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e

services:
  postgres:
    image: ghcr.io/jeongjaesoon/werft-ci/postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
  localstack:
    image: ghcr.io/jeongjaesoon/werft-ci/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
  local-s3-init:
    image: ghcr.io/jeongjaesoon/werft-ci/localstack@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
  secrets:
    image: ghcr.io/jeongjaesoon/werft-ci/localstack@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
  fake-messages:
    image: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
  fake-mcp:
    image: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
  fake-responses:
    image: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
  fake-git:
    build:
      args: *mirror-build-args
  migrate:
    build:
      args: *mirror-build-args
  egress-proxy:
    build:
      args: *mirror-build-args
  api:
    build:
      args: *mirror-build-args
  worker:
    build:
      args: *mirror-build-args
