name: Forbidden terms (threads)

# Comments, reviews and issues change without a push, so a new one is scanned here, with
# the rest of its PR's or issue's texts. Not the required check: review events run on the
# PR's commit, and a job named like forbidden-terms there would stand in for it. A hit
# shows as a failed run; the PR's own check reads the comments again on its next run.
on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  forbidden-terms-threads:
    name: forbidden-terms-threads
    # A stranger's text never starts a scan: its result would answer their guess at the list.
    # The script also skips strangers' texts inside the thread. A review on a fork PR gets no
    # secrets; that PR is scanned once a maintainer moves its branch here.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association ||
        github.event.issue.author_association) &&
      (github.event.pull_request == null ||
        github.event.pull_request.head.repo.full_name == github.repository)
    # On the job, not the workflow: a skipped stranger's event must not cancel a scan.
    concurrency:
      group: forbidden-terms-threads-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The default branch, never the PR's code: this job holds the secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
        with:
          restore-cache: "false"
      - run: bun .github/scripts/forbidden-terms.ts
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          FORBIDDEN_HOST_TERMS: ${{ secrets.FORBIDDEN_HOST_TERMS }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          ISSUE_NUMBER: ${{ (!github.event.issue.pull_request && github.event.issue.number) || '' }}
          TEXT_ONLY: "true"
