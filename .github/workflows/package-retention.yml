name: Package retention (dry run)

on:
  schedule:
    - cron: '41 20 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only audit; false is rejected. Deletion requires a separate reviewed change.'
        type: boolean
        required: true
        default: true
  pull_request:
    paths:
      - .github/scripts/package-retention.ts
      - .github/scripts/package-retention.test.ts
      - .github/workflows/package-retention.yml

permissions:
  contents: read

concurrency:
  group: package-retention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - run: bun test ./.github/scripts/package-retention.test.ts

  preview:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Preview retention decisions with read-only permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/package-retention.ts --dry-run

  dry-run:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: List proposed retention decisions
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
        run: |
          [ "$DRY_RUN" = true ] || { echo "::error::deletion is not implemented; dry_run must be true"; exit 1; }
          bun .github/scripts/package-retention.ts --dry-run
