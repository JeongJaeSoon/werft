name: sdk-release

# PR consumer checks live in ci.yml. Only sdk-v* pushes and manual runs
# reach this workflow; a manual run without a version only tests and packs.
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, equal to packages/sdk/package.json. Empty is a dry run.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bun-setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Ref, version and main CI are checked before any write-capable job.
      - if: github.event_name == 'push' || inputs.version != ''
        name: Commit and version can be released
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/sdk-v*) VERSION=${GITHUB_REF#refs/tags/sdk-v} ;;
            workflow_dispatch:refs/heads/main) ;;
            *) fail "a release requires a pushed sdk-v tag or a manual run on main" ;;
          esac
          version=$(node -p 'require("./packages/sdk/package.json").version')
          [ "$VERSION" = "$version" ] || fail "${VERSION} does not match packages/sdk version ${version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "${GITHUB_SHA} is not on main"
          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&per_page=1"
          ci=$(gh api "$runs" --jq '.workflow_runs[0].conclusion // "not finished"') \
            || fail "could not read main CI for ${GITHUB_SHA}"
          [ "$ci" = success ] || fail "main CI for ${GITHUB_SHA} is ${ci}, not success"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            found=0
            git ls-remote --exit-code origin "refs/tags/sdk-v${VERSION}" >/dev/null || found=$?
            case "$found" in
              0) fail "tag sdk-v${VERSION} already exists" ;;
              2) ;;
              *) fail "could not read tag sdk-v${VERSION} from origin" ;;
            esac
          fi
      - run: bun install --frozen-lockfile
      - run: bun test packages/sdk examples
      - name: SDK_VERSION matches package.json
        run: |
          version=$(node -p 'require("./packages/sdk/package.json").version')
          grep -qx "export const SDK_VERSION = \"${version}\";" packages/sdk/src/version.ts \
            || { echo "::error::packages/sdk/src/version.ts SDK_VERSION is not ${version}"; exit 1; }
      - name: Build the package
        run: bun run --cwd packages/sdk build:package
      - name: The bundle reports the version it is published as
        run: |
          version=$(node -p 'require("./packages/sdk/dist/package.json").version')
          grep -qF "\"${version}\"" packages/sdk/dist/index.js \
            || { echo "::error::packages/sdk/dist/index.js does not carry ${version}"; exit 1; }
      - name: Install, type-check and run the sample in an empty project
        run: bun scripts/sdk-pack-smoke.ts
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-package"
          npm pack ./packages/sdk/dist --pack-destination "$RUNNER_TEMP/sdk-package"
          tar -tzf "$RUNNER_TEMP"/sdk-package/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-package
          path: ${{ runner.temp }}/sdk-package/*.tgz
          if-no-files-found: error
          retention-days: 30

  # GITHUB_TOKEN-created tags do not trigger a second run, so manual releases
  # publish this run's tested artifact after creating the tag atomically.
  tag:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/sdk-v${VERSION}" -f "sha=${GITHUB_SHA}"

  # An external tag push skips `tag`; explicitly admit only that skip.
  # The protected release environment approves both supported release refs.
  publish:
    needs: [build, tag]
    if: >-
      !cancelled() && needs.build.result == 'success'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v') && needs.tag.result == 'skipped')
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != '' && needs.tag.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-package
          path: pkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish ./pkg/*.tgz --provenance --access public
