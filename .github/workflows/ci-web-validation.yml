name: CI web-plan validation
"on": 
  pull_request: 
    branches: 
      - ci/lean-web-validation
permissions: 
  contents: read
concurrency: 
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && (github.event.inputs.allow_parallel == 'true' && github.run_id || format('{0}-{1}-{2}', github.ref, github.sha, github.event.inputs.only))) || github.sha }}"
  cancel-in-progress: "${{ github.event_name != 'push' }}"
jobs: 
  changes: 
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    outputs: 
      tests: "${{ steps.plan.outputs.tests }}"
      product: "${{ steps.plan.outputs.product }}"
      site: "${{ steps.plan.outputs.site }}"
      quickstart: "${{ steps.plan.outputs.quickstart }}"
      docs_only: "${{ steps.plan.outputs.docs_only }}"
      helm: "${{ steps.plan.outputs.helm }}"
      k8s: "${{ steps.plan.outputs.k8s }}"
      domains: "${{ steps.plan.outputs.domains }}"
      sdk_pack: "${{ steps.sdk.outputs.run }}"
      unit_parts: "${{ steps.units.outputs.matrix }}"
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          fetch-depth: 2
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - name: Verify isolated web validation input
        env: 
          EXPECTED_HEAD: ad86744e1d79e849f5dd6951de73be4b9396bf1f
          EXPECTED_BASE: 1ec22ba8936c25584a5c59e5565d3343386e2a10
          ACTUAL_BASE_REF: "${{ github.event.pull_request.base.ref }}"
        run: "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_HEAD\"\ntest \"$(git rev-parse HEAD^1)\" = \"$EXPECTED_BASE\"\npaths=$(git diff --name-only --no-renames \"$EXPECTED_BASE\" HEAD)\ntest \"$paths\" = apps/web/.ci-plan-proof\nprintf 'Validation checkout: %s; candidate: %s; actual PR base: %s; planner base-ref override: main\\n' \"$EXPECTED_HEAD\" \"$EXPECTED_BASE\" \"$ACTUAL_BASE_REF\"\nprintf 'Validation changed path: %s\\n' \"$paths\""
      - id: plan
        env: 
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          BASE_REF: main
          BEFORE_SHA: "${{ github.event.before }}"
        run: bash .github/scripts/ci-plan.sh
      - id: sdk
        name: Plan SDK consumer check
        env: 
          BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.before }}"
        run: "run=true\nif [[ \"$BASE_SHA\" =~ ^[0-9a-f]{40}$ ]] && [ \"$BASE_SHA\" != 0000000000000000000000000000000000000000 ]; then\n  git fetch --no-tags --depth=1 origin \"$BASE_SHA\"\n  git diff --name-only --no-renames -z \"$BASE_SHA\" HEAD >\"$RUNNER_TEMP/sdk-pack-paths\"\n  run=false\n  while IFS= read -r -d '' path; do\n    case \"$path\" in\n      packages/sdk/*|packages/client/*|packages/contracts/*|examples/*|scripts/sdk-pack-smoke.ts|LICENSE|bun.lock|.github/actions/bun-setup/*|.github/workflows/sdk-release.yml|.github/workflows/ci.yml)\n        run=true ;;\n    esac\n  done <\"$RUNNER_TEMP/sdk-pack-paths\"\nfi\necho \"run=$run\" >>\"$GITHUB_OUTPUT\"\n"
      - if: "github.event.inputs.only == 'check' || steps.plan.outputs.domains == '[\"surface\"]'"
        uses: ./.github/actions/bun-setup
        with: 
          restore-cache: "false"
      - id: units
        if: "github.event.inputs.only == 'check' || steps.plan.outputs.domains == '[\"surface\"]'"
        env: 
          DOMAINS: "${{ steps.plan.outputs.domains }}"
          ONLY: "${{ github.event.inputs.only || 'all' }}"
        run: "args=()\nif [ \"$ONLY\" != check ] && [ \"$DOMAINS\" = '[\"surface\"]' ]; then\n  args+=(--exclude-surface)\nfi\nmatrix=$(bun .github/scripts/unit-part.ts matrix \"${args[@]}\")\necho \"matrix=$matrix\" >>\"$GITHUB_OUTPUT\"\n\nprintf 'Validation unit matrix: %s\\n' \"$matrix\"\n"
  static: 
    name: check (static)
    if: "contains(fromJSON('[\"all\",\"check\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - uses: ./.github/actions/bun-setup
        with: 
          save-cache: "true"
      - id: install
        run: bun install --frozen-lockfile
      - run: bun run typecheck
      - if: "!cancelled() && steps.install.outcome == 'success'"
        run: bun run lint
      - if: "!cancelled() && steps.install.outcome == 'success'"
        run: bun scripts/third-party-notices.ts --check
  docs-checks: 
    needs: changes
    if: "needs.changes.outputs.docs_only == 'true' && contains(fromJSON('[\"all\",\"check\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: Repository policy and documentation tests
        run: bun test ./tests
  check-part: 
    name: "check (${{ matrix.part }})"
    needs: changes
    if: "needs.changes.outputs.tests == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'check')\n  || needs.changes.outputs.domains == '[\"surface\"]')\n&& contains(fromJSON('[\"all\",\"check\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy: 
      fail-fast: false
      matrix: 
        include: "${{ fromJSON(needs.changes.outputs.unit_parts) }}"
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: Tests of this part
        env: 
          UNIT: "${{ matrix.unit }}"
          DOMAINS: "${{ needs.changes.outputs.domains }}"
          ONLY: "${{ github.event.inputs.only || 'all' }}"
        run: "args=()\nif [ \"$ONLY\" != check ] && [ \"$DOMAINS\" = '[\"surface\"]' ]; then\n  args+=(--exclude-surface)\nfi\nfiles=$(bun .github/scripts/unit-part.ts \"$UNIT\" \"${args[@]}\")\nmapfile -t files <<<\"$files\"\nbun test \"${files[@]}\"\n"
  check: 
    needs: 
      - changes
      - static
      - check-part
      - integration-domain
      - docs-checks
      - storybook
      - docs
      - demo
      - ui-pack
      - workspace-quota
      - helm-chart
      - k8s-smoke
      - pages
    if: "always() && contains(fromJSON('[\"all\",\"check\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: 
      - id: verdict
        if: "!cancelled()"
        env: 
          RESULT: "${{ (github.event.inputs.only == 'check' || needs.changes.outputs.domains == '[\"surface\"]') && needs.check-part.result || needs.integration-domain.result }}"
          PLAN: "${{ needs.changes.result }}"
          STATIC: "${{ needs.static.result }}"
          DOCS: "${{ needs.docs-checks.result }}"
          TESTS: "${{ needs.changes.outputs.tests }}"
          DOCS_ONLY: "${{ needs.changes.outputs.docs_only }}"
        run: "[ \"$PLAN\" = success ] && [ \"$STATIC\" = success ] || exit 1\ncase \"$TESTS:$DOCS_ONLY:$RESULT:$DOCS\" in\n  true:false:success:skipped) echo \"check: all planned tests passed\" ;;\n  false:true:skipped:success) echo \"check: documentation policy tests passed; product tests are not needed\" ;;\n  *) echo \"::error::invalid or failed check plan/results\"; exit 1 ;;\nesac\n"
      - id: product-results
        if: "!cancelled()"
        env: 
          RESULTS: "${{ toJSON(needs) }}"
          ONLY: "${{ github.event.inputs.only || 'all' }}"
        run: "[ -n \"$RESULTS\" ] || exit 1\nif ! jq -e --arg only \"$ONLY\" '\n  . as $needs\n  | .changes.outputs as $plan\n  | ($plan.domains | fromjson) as $domains\n  | {\n      \"helm-chart\": ($plan.helm == \"true\"),\n      \"k8s-smoke\": ($plan.k8s == \"true\"),\n      \"storybook\": ($plan.site == \"true\"),\n      \"docs\": ($plan.site == \"true\"),\n      \"pages\": ($plan.site == \"true\"),\n      \"demo\": ($plan.product == \"true\"),\n      \"ui-pack\": ($plan.product == \"true\"),\n      \"workspace-quota\": ($plan.product == \"true\" and ($domains | index(\"docker\") != null))\n    } as $expected\n  | ([\"all\", \"check\"] | index($only) != null)\n    and (.changes.result == \"success\")\n    and all(.[]; .result == \"success\" or .result == \"skipped\")\n    and ([\"helm\", \"k8s\", \"site\", \"product\"] | all(.[]; $plan[.] == \"true\" or $plan[.] == \"false\"))\n    and ($domains | type == \"array\" and all(.[]; type == \"string\"))\n    and ($expected | to_entries | all(.[];\n      $needs[.[\"key\"]].result == (if $only == \"all\" and .value then \"success\" else \"skipped\" end)))\n' <<<\"$RESULTS\" >/dev/null; then\n  echo \"::error::invalid product plan or job results; planned jobs must succeed and omitted jobs must be skipped\"\n  exit 1\nfi\n"
      - id: cancelled
        if: cancelled()
        run: "echo \"::error::workflow was cancelled\"\nexit 1\n"
  integration-domain: 
    name: "integration (${{ matrix.domain }})"
    needs: changes
    if: "needs.changes.outputs.tests == 'true' && contains(fromJSON('[\"all\",\"integration\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy: 
      fail-fast: false
      matrix: 
        include: 
          - domain: db
            postgres: true
            localstack: false
            docker: false
            paths: 
              - packages/db/
              - packages/testkit/src/postgres.
              - tests/repository-migration-report.
          - domain: api
            postgres: true
            localstack: true
            docker: false
            paths: 
              - apps/control-host/src/api/
              - apps/control-host/src/main
              - apps/control-host/src/metrics/
              - apps/control-host/src/pass-loop/
              - apps/control-host/src/reconciler/
              - tests/catalog-mismatch.
              - tests/context-gap-flow.
              - tests/drain-park-flow.
              - tests/feature-gate-flow.
              - tests/interrupt-flow.
              - tests/lease-clock.
              - tests/park-resume-flow.
          - domain: surface
            postgres: true
            localstack: true
            docker: false
            paths: 
              - apps/control-host/src/slack/
              - packages/contracts/
              - packages/client/
              - packages/sdk/
              - examples/
              - packages/core/
              - packages/react/
              - apps/web/
              - apps/storybook/
          - domain: storage
            postgres: false
            localstack: true
            docker: false
            paths: 
              - packages/storage/
              - packages/testkit/src/localstack.
              - tests/checkpoint-flow.
              - tests/checkpoint-pins.
              - tests/object-store-cli.
              - tests/object-store-route.
              - tests/test-ops-bundle.
              - tests/test-ops.
              - tests/worker-checkpoint-publish.
            skips: 
              - file: packages/storage/src/git-runner.test.ts
                test: "where limits cannot be enforced git still runs, and says so once"
          - domain: docker
            postgres: true
            localstack: false
            docker: true
            paths: 
              - apps/control-host/src/scheduler/
              - packages/adapters/execution/local-docker/src/backend.
              - packages/adapters/execution/local-docker/src/config.
              - packages/adapters/execution/local-docker/src/docker-client.
              - packages/adapters/execution/local-docker/src/workspace
              - tests/backup-restore.
              - tests/images.
              - tests/scheduler-launch-claim.
          - domain: egress
            postgres: false
            localstack: false
            docker: true
            paths: 
              - apps/egress-proxy/
              - packages/adapters/execution/local-docker/src/egress.
              - tests/credential-routes.
              - tests/sdk-egress-proxy.
          - domain: worker
            postgres: false
            localstack: false
            docker: false
            paths: 
              - apps/worker/
              - packages/adapters/execution/kubernetes/
              - packages/adapters/runtimes/
              - packages/observability/
              - packages/platform/
              - packages/runtime-core/
              - packages/system/
              - packages/ui/
              - packages/testkit/src/fake-anthropic.
              - packages/testkit/src/fake-git.
              - packages/testkit/src/fake-github.
              - packages/testkit/src/scripted-messages.
              - packages/testkit/src/workspace.
              - tests/agent-sdk-compat/
              - tests/architecture.
              - tests/ci-images.
              - tests/ci-services.
              - tests/ci-plan.
              - tests/ci-static-checks.
              - tests/install-rehearsal.
              - tests/d2-gate/
              - tests/dev/
              - tests/docs-i18n-code.
              - tests/docs-links.
              - tests/docs-meta-pairs.
              - tests/docs-reader-contract.
              - tests/docs-self-hosting-commands.
              - tests/docs-self-hosting-facts.
              - tests/docs-self-hosting-urls.
              - tests/docs-site-links.
              - tests/e2e/local-model.
              - tests/e2e/real-model.
              - tests/fetch-pinned.
              - tests/forbidden-terms.
              - tests/soak/
              - tests/ci-issue-scripts.
              - tests/integration-jobs.
              - tests/local-sh.
              - tests/pages-workflow.
              - tests/preview-reap.
              - tests/release-auto.
              - tests/sdk-release.
              - tests/supply-chain.
              - tests/test-files.
              - tests/third-party-notices.
              - tests/ui-release.
              - tests/unit-part.
              - tests/verify-stack.
            skips: 
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: (unnamed)
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "a delete conditioned on the replaced Pod's UID leaves the replacement running"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "a failed worker reports its exit, reason and log tail"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "terminating one generation leaves the next generation's Pod untouched"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "the nonce is in the Pod's own Secret only, never in the Pod"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "terminate and workspace removal leave no Pod, Secret or PVC of the session"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: (unnamed)
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "ensureExecution twice → one resource, adopted without a new nonce"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "inspect: found:false for nothing launched, running for a launch"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: listManaged returns what was launched and drops what was terminated
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "terminate: generation_mismatch, terminated, absent — only the matching generation"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: a resource removed out of band is re-created; terminate conditioned on the old providerRef leaves the replacement
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: a resource launched with another spec is refused with LaunchSpecMismatchError and left in place
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "workspace pair, when present: lists the session's workspace and removes it only once unused"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "assertReplaceable, when present: resolves for a launchable intent and launches nothing"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "reconcileNetworks, when present: clears what an out-of-band removal left, then has nothing to do"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: (unnamed)
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "A: two turns on one engine, checkpoint, restore onto a clean worker"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "B: a publish that fails at the manifest is never promoted"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "C: a transcript mirror error blocks the checkpoint and new input"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "D: a worker that loses its lease mid-turn promotes nothing"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "E: an accepted interrupt stops its turn, however early it lands"
              - file: tests/d2-gate/reconciler-sweep.e2e.test.ts
                test: (unnamed)
              - file: tests/d2-gate/reconciler-sweep.e2e.test.ts
                test: "R1: a worker whose heartbeat stopped is fenced by the periodic pass and its turn settled unknown"
              - file: tests/d2-gate/reconciler-sweep.e2e.test.ts
                test: "R2: an interrupt its heartbeating worker cannot settle is sent to terminate and its receipt ends unknown"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: (unnamed)
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H1: one image runs the three roles and only the scheduler holds the Docker socket"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H2: a scheduler restarted mid-turn ends no worker and launches none twice"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H3: the api and reconciler come back from a restart and the session takes its next turn"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H4: with PostgreSQL down the loops fail their passes, and recover once it is back"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H5: a scheduler without Docker reserves nothing, and the real one launches the waiting session once"
    env: 
      BUN_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
      DOCKER_BACKEND_TEST_HELPER_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      DOCKER_BACKEND_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      EGRESS_CURL_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
      EGRESS_PROXY_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
      EXECUTION_WORKSPACE_MIGRATION_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      LOCALSTACK_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/localstack@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    steps: 
      - id: gate
        env: 
          PLANNED: "${{ contains(fromJSON(needs.changes.outputs.domains), matrix.domain) }}"
        run: "echo \"run=$PLANNED\" >>\"$GITHUB_OUTPUT\""
      - if: "steps.gate.outputs.run == 'true'"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - if: "steps.gate.outputs.run == 'true' && (matrix.postgres || matrix.localstack)"
        env: 
          POSTGRES: "${{ matrix.postgres }}"
          LOCALSTACK: "${{ matrix.localstack }}"
          POSTGRES_SERVICE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
          LOCALSTACK_SERVICE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/localstack@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
        run: .github/scripts/ci-services.sh start
      - if: "steps.gate.outputs.run == 'true'"
        uses: ./.github/actions/bun-setup
      - if: "steps.gate.outputs.run == 'true'"
        run: bun install --frozen-lockfile
      - if: "steps.gate.outputs.run == 'true'"
        name: "Opt-in variables of this job's services"
        env: 
          POSTGRES: "${{ matrix.postgres }}"
          LOCALSTACK: "${{ matrix.localstack }}"
          DOCKER: "${{ matrix.docker }}"
        run: "{\n  if [ \"$POSTGRES\" = true ]; then\n    echo \"QUEUE_DATABASE_URL=postgresql://postgres:dev@127.0.0.1:5432/sessions\"\n  fi\n  if [ \"$LOCALSTACK\" = true ]; then\n    echo \"AWS_ACCESS_KEY_ID=test\"\n    echo \"AWS_ENDPOINT_URL=http://127.0.0.1:4566\"\n    echo \"AWS_REGION=ap-northeast-1\"\n    echo \"AWS_SECRET_ACCESS_KEY=test\"\n    echo \"S3_BUCKET=claude-sessions\"\n    echo \"STORAGE_LOCALSTACK_TEST=1\"\n  fi\n  # ubuntu runners ship a Docker daemon: run the LocalDockerBackend\n  # integration tests against it (busybox) instead of skipping them.\n  if [ \"$DOCKER\" = true ]; then\n    echo \"DOCKER_BACKEND_TEST=1\"\n  fi\n} >>\"$GITHUB_ENV\"\n"
      - if: "steps.gate.outputs.run == 'true' && matrix.docker"
        name: "Record the daemon's events"
        run: "echo \"DOCKER_EVENTS_SINCE=$(date -u '+%Y-%m-%d %H:%M:%S')\" >>\"$GITHUB_ENV\"\nnohup docker events --format '{{json .}}' >\"$RUNNER_TEMP/docker-events.jsonl\" 2>&1 &\n"
      - if: "steps.gate.outputs.run == 'true' && (matrix.postgres || matrix.localstack)"
        env: 
          POSTGRES: "${{ matrix.postgres }}"
          LOCALSTACK: "${{ matrix.localstack }}"
        run: .github/scripts/ci-services.sh wait
      - if: "steps.gate.outputs.run == 'true'"
        name: Tests of this domain
        env: 
          DOMAIN: "${{ matrix.domain }}"
        run: "files=$(bun .github/scripts/integration-jobs.ts files \"$DOMAIN\")\nmapfile -t files <<<\"$files\"\nbun test --reporter=junit --reporter-outfile=\"$RUNNER_TEMP/junit.xml\" \"${files[@]}\"\nbun .github/scripts/integration-jobs.ts verify \"$DOMAIN\" \"$RUNNER_TEMP/junit.xml\"\n"
      - if: "steps.gate.outputs.run == 'true' && !cancelled()"
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      - if: failure() && matrix.docker
        name: "Keep the daemon's record of a failed run"
        run: "sudo kill -USR1 \"$(pidof dockerd)\" || true\nsleep 2\nsudo journalctl -u docker -u containerd --since \"$DOCKER_EVENTS_SINCE\" --no-pager -o short-iso-precise >\"$RUNNER_TEMP/docker-daemon.log\" || true\nsudo sh -c \"cp /var/run/docker/goroutine-stacks-*.log '$RUNNER_TEMP/' 2>/dev/null\" || true\nsudo chmod a+r \"$RUNNER_TEMP\"/docker-* \"$RUNNER_TEMP\"/goroutine-stacks-*.log 2>/dev/null || true\n"
      - if: failure() && matrix.docker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: 
          name: "docker-daemon-${{ matrix.domain }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/docker-events.jsonl\n${{ runner.temp }}/docker-daemon.log\n${{ runner.temp }}/goroutine-stacks-*.log\n"
          if-no-files-found: ignore
          retention-days: 14
      - if: "always() && steps.gate.outputs.run == 'true'"
        run: .github/scripts/ci-services.sh stop
  integration: 
    needs: 
      - changes
      - integration-domain
      - e2e
      - quickstart
    if: "always() && contains(fromJSON('[\"all\",\"integration\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: 
      - id: verdict
        if: "!cancelled()"
        env: 
          RESULT: "${{ needs.integration-domain.result }}"
          E2E: "${{ needs.e2e.result }}"
          QUICKSTART: "${{ needs.quickstart.result }}"
          EVENT: "${{ github.event_name }}"
          ONLY: "${{ github.event.inputs.only || 'all' }}"
          PLAN: "${{ needs.changes.result }}"
          TESTS: "${{ needs.changes.outputs.tests }}"
          DOCS_ONLY: "${{ needs.changes.outputs.docs_only }}"
        run: "[ \"$PLAN\" = success ] || exit 1\ncase \"$EVENT:$ONLY:$E2E:$QUICKSTART\" in\n  pull_request:all:success:success | push:all:success:success | workflow_dispatch:all:success:success) ;;\n  workflow_dispatch:integration:skipped:skipped) ;;\n  *) echo \"::error::required scenario or guide jobs did not pass\"; exit 1 ;;\nesac\ncase \"$TESTS:$DOCS_ONLY:$RESULT\" in\n  true:false:success) echo \"integration: all domains passed\" ;;\n  false:true:skipped) echo \"integration: documentation-only PR; no product test inputs changed\" ;;\n  *) echo \"::error::invalid or failed integration plan/results\"; exit 1 ;;\nesac\n"
      - id: cancelled
        if: cancelled()
        run: "echo \"::error::workflow was cancelled\"\nexit 1\n"
  storybook: 
