      - name: helm and kubeconform
        run: "mkdir -p \"$RUNNER_TEMP/bin\"\ncd \"$RUNNER_TEMP\"\ncurl -fsSLo helm.tgz \"https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz\"\necho \"${HELM_SHA256}  helm.tgz\" | sha256sum -c -\ntar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm\nbun \"$GITHUB_WORKSPACE/scripts/fetch-pinned.ts\" \\\n  \"https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz\" \\\n  \"$KUBECONFORM_SHA256\" kubeconform.tgz \\\n  https://api.github.com/repos/yannh/kubeconform/releases/assets/438612666\ntar -xzf kubeconform.tgz -C bin kubeconform\necho \"$RUNNER_TEMP/bin\" >>\"$GITHUB_PATH\"\n"
      - name: helm lint
