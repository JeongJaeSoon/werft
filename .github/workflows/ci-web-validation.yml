    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: "kind, kubectl and helm"
        run: "mkdir -p \"$RUNNER_TEMP/bin\"\ncd \"$RUNNER_TEMP\"\ncurl -fsSLo bin/kind \"https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64\"\necho \"${KIND_SHA256}  bin/kind\" | sha256sum -c -\ncurl -fsSLo bin/kubectl \"https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl\"\necho \"${KUBECTL_SHA256}  bin/kubectl\" | sha256sum -c -\nchmod +x bin/kind bin/kubectl\ncurl -fsSLo helm.tgz \"https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz\"\necho \"${HELM_SHA256}  helm.tgz\" | sha256sum -c -\ntar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm\necho \"$RUNNER_TEMP/bin\" >>\"$GITHUB_PATH\"\n"
      - name: deploy/kind/smoke.sh
        env: 
          CLUSTER_NAME: k8s-smoke
          STATE_DIR: "${{ runner.temp }}/kind"
          KIND_NODE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/kind-node@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          REGISTRY_IMAGE: ghcr.io/jeongjaesoon/werft-ci/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          BUN_IMAGE: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
          BUILDKIT_SYNTAX: ghcr.io/jeongjaesoon/werft-ci/dockerfile@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e
          PROBE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          K8S_BACKEND_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        run: "KIND_IMAGE_MIRROR=\"${BUN_IMAGE%/*}\" deploy/kind/smoke.sh"
      - if: "!cancelled()"
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
  agent-sdk-compat: 
    needs: 
      - changes
      - static
    permissions: 
      contents: read
      issues: write
    if: "!cancelled() && needs.static.result != 'failure' && needs.changes.outputs.product == 'true' && github.event_name != 'pull_request' && contains(fromJSON('[\"all\",\"agent-sdk-compat\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - uses: ./.github/actions/bun-setup
        with: 
          cache-scope: agent-sdk-compat
          save-cache: "true"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: 
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: bun install --frozen-lockfile
      - run: bun install --cwd scripts/agent-sdk-compat --frozen-lockfile
      - run: "uv tool install 'litellm[proxy]==1.100.1'"
      - run: bun run --cwd scripts/agent-sdk-compat probe:version
      - id: harness
        name: agent-sdk-compat check
        run: bun run --cwd scripts/agent-sdk-compat check
      - if: "!cancelled()"
        name: Report harness outcome
        env: 
          HARNESS: "${{ steps.harness.outcome }}"
        run: "{\n  echo \"### agent-sdk-compat (non-blocking)\"\n  echo\n  echo \"| suite | outcome |\"\n  echo \"| --- | --- |\"\n  echo \"| scripts/agent-sdk-compat | ${HARNESS} |\"\n  echo\n  echo \"This job never fails the run. A \\`failure\\` above still needs a look.\"\n} >>\"$GITHUB_STEP_SUMMARY\"\n"
      - if: "!cancelled() && steps.harness.outcome != 'success'"
        name: Open or update the agent-sdk-compat failure issue
        env: 
          GH_REPO: "${{ github.repository }}"
          GH_TOKEN: "${{ github.token }}"
          HARNESS: "${{ steps.harness.outcome }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: "{\n  echo \"<!-- ci-agent-sdk-compat-failure -->\"\n  echo \"\\`agent-sdk-compat\\` failed on \\`${GITHUB_REF_NAME}\\` @ \\`${GITHUB_SHA}\\` (${GITHUB_EVENT_NAME}, [run ${GITHUB_RUN_ID}](${RUN_URL})).\"\n  echo\n  echo \"| suite | outcome |\"\n  echo \"| --- | --- |\"\n  echo \"| scripts/agent-sdk-compat | ${HARNESS} |\"\n  echo\n  echo \"The run itself is green (\\`continue-on-error\\`). Close this issue once the failure is understood; the next failure reopens a new one.\"\n} >body.md\n.github/scripts/upsert-ci-issue.sh ci-agent-sdk-compat-failure \\\n  \"CI: agent-sdk-compat failed (non-blocking job)\" body.md\n"