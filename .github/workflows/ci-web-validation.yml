      - name: kubeconform
        run: "set -o pipefail\nfor values in deploy/helm/ci-digests.yaml deploy/helm/werft/values-aws.example.yaml; do\n  echo \"== $values\"\n  helm template ap deploy/helm/werft -f deploy/helm/ci-digests.yaml -f \"$values\" \\\n    | kubeconform -strict -summary -kubernetes-version 1.33.0 \\\n        -schema-location \"$K8S_SCHEMAS\" -schema-location \"$CRD_SCHEMAS\"\ndone\n"
