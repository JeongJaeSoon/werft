      - if: "always() && needs.changes.outputs.product == 'true'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: 
          name: e2e-record
          path: "${{ runner.temp }}/e2e"
          if-no-files-found: ignore
          retention-days: 14
      - id: verdict
        name: Required scenario verdict
        if: always() && !cancelled()
        env: 
          PLAN: "${{ needs.changes.result }}"
          PRODUCT: "${{ needs.changes.outputs.product }}"
          DOCS_ONLY: "${{ needs.changes.outputs.docs_only }}"
          SCENARIO: "${{ steps.scenario.outcome }}"
        run: "[ \"$PLAN\" = success ] || exit 1\ncase \"$PRODUCT:$DOCS_ONLY:$SCENARIO\" in\n  true:false:success) echo \"e2e: scenario passed\" ;;\n  false:true:skipped) echo \"e2e: intentionally omitted for documentation-only inputs\" ;;\n  *) echo \"::error::required e2e scenario did not pass\"; exit 1 ;;\nesac\n"
      - id: cancelled
        if: cancelled()
        run: "echo \"::error::workflow was cancelled\"\nexit 1\n"
  quickstart: 
    needs: changes
    if: "!cancelled() && contains(fromJSON('[\"all\",\"quickstart\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
