          retention-days: 7
  sdk-pack-smoke: 
    needs: changes
    if: "needs.changes.outputs.sdk_pack == 'true' && contains(fromJSON('[\"all\",\"sdk-pack-smoke\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - uses: ./.github/actions/bun-setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: 
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun test packages/sdk examples
      - name: SDK_VERSION matches package.json
        run: "version=$(node -p 'require(\"./packages/sdk/package.json\").version')\ngrep -qx \"export const SDK_VERSION = \\\"${version}\\\";\" packages/sdk/src/version.ts \\\n  || { echo \"::error::SDK_VERSION does not match packages/sdk/package.json\"; exit 1; }\n"
      - run: bun run --cwd packages/sdk build:package
      - name: The bundle reports the version it is published as
        run: "version=$(node -p 'require(\"./packages/sdk/dist/package.json\").version')\ngrep -qF \"\\\"${version}\\\"\" packages/sdk/dist/index.js \\\n  || { echo \"::error::SDK bundle does not carry its package version\"; exit 1; }\n"
      - name: "Install, type-check and run the sample in an empty project"
