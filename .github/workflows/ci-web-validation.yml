        run: "[ \"$PLAN\" = success ] || exit 1\ncase \"$QUICKSTART:$DOCS_ONLY\" in\n  true:true | true:false) echo \"quickstart: product or guide inputs changed; running both guides\" ;;\n  false:true) echo \"quickstart: documentation-only PR; executable guides unchanged\" ;;\n  false:false) echo \"quickstart: changed paths reach neither the images nor the guides\" ;;\n  *) echo \"::error::invalid executable guide plan\"; exit 1 ;;\nesac\n"
      - if: "success() && !cancelled() && needs.changes.outputs.quickstart == 'true'"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
