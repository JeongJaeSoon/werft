          DOCS_ONLY: "${{ needs.changes.outputs.docs_only }}"
          GUIDE: "${{ steps.guide.outcome }}"
          API_GUIDE: "${{ steps.api-guide.outcome }}"
        run: "[ \"$PLAN\" = success ] || exit 1\ncase \"$QUICKSTART:$DOCS_ONLY:$GUIDE:$API_GUIDE\" in\n  true:false:success:success | true:true:success:success) echo \"quickstart: both guides passed\" ;;\n  false:true:skipped:skipped | false:false:skipped:skipped) echo \"quickstart: intentionally omitted; executable guides unchanged\" ;;\n  *) echo \"::error::required executable guide did not pass\"; exit 1 ;;\nesac\n"
      - id: cancelled
        if: cancelled()
        run: "echo \"::error::workflow was cancelled\"\nexit 1\n"
  helm-chart: 
    needs: changes
