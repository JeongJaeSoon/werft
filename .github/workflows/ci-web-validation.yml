        run: scripts/pages-site.sh docs-out storybook-dist _site
  workspace-quota: 
    needs: changes
    if: "!cancelled() && needs.changes.outputs.product == 'true' && contains(fromJSON(needs.changes.outputs.domains), 'docker') && contains(fromJSON('[\"all\",\"workspace-quota\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: Project-quota filesystem
        run: "command -v mkfs.xfs >/dev/null || {\n  sudo apt-get update && sudo apt-get install -y xfsprogs\n}\nsudo truncate -s 8G /xfs.img\nsudo mkfs.xfs -q /xfs.img\nsudo mkdir -p /mnt/xfs\nsudo mount -o loop,prjquota /xfs.img /mnt/xfs\n# Fail here rather than three steps later with a confusing 400.\nmount | grep -q 'on /mnt/xfs .*prjquota'\n"
      - name: Daemon on that filesystem
        run: "mkdir -p /tmp/apq\ndocker run -d --privileged --name apq \\\n  -e DOCKER_TLS_CERTDIR= \\\n  -v /mnt/xfs:/var/lib/docker \\\n  -v /tmp/apq:/sock \\\n  ghcr.io/jeongjaesoon/werft-ci/docker@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac \\\n  --host=unix:///sock/docker.sock\nfor _ in $(seq 1 60); do\n  docker exec apq docker version >/dev/null 2>&1 && break\n  sleep 2\ndone\nsudo chmod 666 /tmp/apq/docker.sock\ndocker exec apq docker info --format 'driver={{.Driver}} root={{.DockerRootDir}}'\n# Prove the capability before any test claims to have used it.\ndocker exec apq docker volume create --driver local --opt size=64m apq-probe\ndocker exec apq docker volume rm apq-probe\n"
      - name: Inode helper image on that daemon
        run: "printf '%s\\n' \\\n  \"FROM ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4\" \\\n  \"RUN apt-get update && apt-get install -y --no-install-recommends xfsprogs && rm -rf /var/lib/apt/lists/*\" \\\n  'VOLUME [\"/workspace\"]' \\\n  | docker exec -i apq docker build -q -t ap-inode-helper:ci -\n"
      - name: Workspace suite against a quota-capable daemon
        env: 
          DOCKER_BACKEND_TEST: "1"
          DOCKER_BACKEND_TEST_HELPER_IMAGE: ap-inode-helper:ci
          DOCKER_BACKEND_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          DOCKER_HOST: unix:///tmp/apq/docker.sock
          EXECUTION_WORKSPACE_MIGRATION_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        run: bun test packages/adapters/execution/local-docker/src/workspace.integration.test.ts packages/adapters/execution/local-docker/src/workspace-migration.integration.test.ts
      - if: "!cancelled()"
        name: Nothing pulled from Docker Hub
        run: ".github/scripts/assert-no-docker-hub-images.sh docker\n.github/scripts/assert-no-docker-hub-images.sh env DOCKER_HOST=unix:///tmp/apq/docker.sock docker\n"
      - if: always()
        run: "docker logs apq 2>&1 | tail -40 || true\ndocker rm -f apq || true\n"
  e2e: 
    needs: changes
    if: "!cancelled() && contains(fromJSON('[\"all\",\"e2e\"]'), github.event.inputs.only || 'all')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: 
      - name: Validate product test plan
        if: "!cancelled()"
        env: 
          PLAN: "${{ needs.changes.result }}"
          PRODUCT: "${{ needs.changes.outputs.product }}"
          DOCS_ONLY: "${{ needs.changes.outputs.docs_only }}"
        run: "[ \"$PLAN\" = success ] || exit 1\ncase \"$PRODUCT:$DOCS_ONLY\" in\n  true:false) echo \"e2e: product inputs changed; running the complete scenario\" ;;\n  false:true) echo \"e2e: documentation-only PR; product inputs unchanged\" ;;\n  *) echo \"::error::invalid product test plan\"; exit 1 ;;\nesac\n"
      - if: "success() && !cancelled() && needs.changes.outputs.product == 'true'"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          ref: ad86744e1d79e849f5dd6951de73be4b9396bf1f
      - if: "success() && !cancelled() && needs.changes.outputs.product == 'true'"
        uses: ./.github/actions/bun-setup
      - if: "success() && !cancelled() && needs.changes.outputs.product == 'true'"
        run: bun install --frozen-lockfile
      - if: "success() && !cancelled() && needs.changes.outputs.product == 'true'"
