name: Pages

# Builds the Pages site (the Fumadocs site, the API reference below /api/)
# and deploys it. The public site describes the released product, so only a
# release tag (v*, the tag images.yml releases) deploys. A manual run on main
# pushes an urgent docs fix before the next release; a manual run on a tag
# redeploys that release. A pull request proves the same build and layout in
# ci.yml (`docs`, `pages`) and never deploys.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that is building or deploying: a later run must not stop
# an earlier one's deploy half-way. Runs queue one behind the other, and
# GitHub keeps only the newest of the waiting ones, so the site ends at the
# last started run's content.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      # next build runs on Node; pinned, not the image's own.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - id: docs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.next/cache
          key: next-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/src/**', 'apps/docs/content/**', 'apps/docs/*.ts', 'apps/docs/*.json', 'apps/docs/*.mjs', 'docs/openapi.json') }}
          restore-keys: next-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-
      - name: Static build
        run: bun run --cwd apps/docs build
      - name: Self-hosting public URL and fallback contract
        run: bun run scripts/check-docs-self-hosting-export.ts
      - if: github.ref == 'refs/heads/main' && steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.next/cache
          key: ${{ steps.docs-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-out
          path: apps/docs/out
          retention-days: 1

  # Gated on the PAGES_ENABLED repo variable: with Pages off, deploy-pages
  # answers 404 and turns main red. The only job in the repository that may
  # write to Pages.
  deploy:
    needs: [docs]
    if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && vars.PAGES_ENABLED == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Same rule as images.yml's release jobs: a tag is not a review.
      - name: Commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-out
          path: docs-out
      - name: Pages site layout
        run: scripts/pages-site.sh docs-out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      # A healthy deploy finishes in 14-28s whatever the site size (runs
      # 42748378902..42773191225). Twice (42742765531, 42775912684) GitHub's
      # side stalled in deployment_queued / syncing_files until the job's own
      # 10 minute limit cancelled it, with a same-sized artifact. Waiting does
      # not clear a stall, so give up at 3 minutes and start a fresh
      # deployment once.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 180000
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 180000
