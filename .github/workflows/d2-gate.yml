name: D2 gate

# The D2 gate (A–E, R1–R2, H1–H5) needs the whole compose stack on
# images built from the checkout, so CI's integration domains
# (.github/integration-domains.yml) declare its tests skipped and
# only scripts/d2-gate/run.sh runs them. Run by hand alone, the harness went
# stale without anyone noticing (: gate A broke on
# incremental bundles). This workflow runs it on pushes to main, and once on a
# pull request marked ready for review that changes the gate itself or the
# paths that decide who ends a worker and what its turn becomes (its D, R and H
# tests). Opening a pull request or pushing to it runs nothing, also after it
# is ready: a quarter of those runs were cancelled by the next push. The list
# is a cut, not a proof: the gate drives the whole stack, so a change to shared
# code (the API server, contracts, the schema, the pool), or to what only the
# checkpoint, transcript and interrupt tests (A–C, E) read, waits for main, as
# does a push after the ready run.
#
# Deliberately NOT a required status check: it does not run on most pull
# requests, so a required context would leave them waiting forever. A failure
# on main lands in an issue instead. scripts/soak/rc.sh runs the same gate
# before a release candidate's campaigns.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]
    # Gate runtime inputs. CI's declared skips are already checked by the
    # required policy tests and worker JUnit verification.
    paths:
      - .github/scripts/d2-gate-verdict.ts
      - .github/workflows/d2-gate.yml
      - .github/actions/bun-setup/**
      - .github/scripts/assert-no-docker-hub-images.sh
      - .dockerignore
      - apps/*/Dockerfile
      - bun.lock
      - infra/compose*.yml
      - tests/e2e/compose.ci-mirror.yml
      - scripts/d2-gate/**
      - tests/d2-gate/**
      # What gate D, R1–R2 and H1–H5 settle: who ends a worker, and what its
      # turn becomes. A change here that moved gate D's outcome was first seen
      # only after it merged.
      # The scheduler, the reconciler's sweep and the loops both run in:
      - apps/control-host/src/main.ts
      - apps/control-host/src/pass-loop/**
      - apps/control-host/src/reconciler/**
      - apps/control-host/src/scheduler/**
      - packages/platform/src/scheduler/**
      - packages/db/src/scheduler/**
      - packages/adapters/execution/local-docker/src/**
      # The turn and its lease, on the server and in the worker:
      - packages/platform/src/sessions/**
      - packages/db/src/sessions/**
      - packages/platform/src/workers/**
      - apps/control-host/src/api/routes/workers/**
      - packages/platform/src/ports/worker-unit-of-work.ts
      - packages/db/src/worker-unit-of-work.ts
      - packages/db/src/postgres-unit-of-work.ts
      - packages/db/src/recovery-control.ts
      - apps/worker/src/**

permissions:
  contents: read

concurrency:
  # Pushes to main take turns: one runs and only the newest waits, so a burst
  # of merges holds one runner and the tip is still gated. A running one is
  # never cancelled: that would read as a failure. A manual run has a group of
  # its own, so no later push replaces it while it waits.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  d2-gate:
    runs-on: ubuntu-24.04
    # Image builds as in ci.yml's e2e, then the three suites one after
    # another on one stack: about 10 minutes ('s first runs).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      # The runner's own daemon, as in ci.yml's e2e: the scheduler refuses one
      # older than Docker 28. Both overlays point every third-party
      # image and the Dockerfiles' base at the CI mirror.
      - name: scripts/d2-gate/run.sh
        env:
          D2_GATE_COMPOSE_OVERRIDE: tests/e2e/compose.ci-mirror.yml:scripts/d2-gate/compose.ci-mirror.yml
          D2_GATE_OUT: ${{ runner.temp }}/d2-gate
        run: scripts/d2-gate/run.sh
      # Each test's result (run.sh printed it above too) and A–E's criteria
      # table, onto the run's summary page.
      - if: '!cancelled()'
        name: Report
        env:
          OUT: ${{ runner.temp }}/d2-gate
        run: |
          {
            if [ -f "$OUT/verdict.txt" ]; then
              printf '```text\n%s\n```\n\n' "$(cat "$OUT/verdict.txt")"
              cat "$OUT/report.md" 2>/dev/null || echo "no A–E report"
            else
              echo "no verdict: the gate stopped before its tests (see the d2-gate-record artifact)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # run.sh removes the images it built; what compose pulled stays.
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      # Build, compose, worker and suite logs. vars.sh stays behind: it holds
      # the run's API key.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d2-gate-record
          path: |
            ${{ runner.temp }}/d2-gate
            !${{ runner.temp }}/d2-gate/vars.sh
          if-no-files-found: ignore
          retention-days: 14

  # A job of its own, not a last step: a job timeout cancels every step left
  # in that job, so only another job still sees a gate that hung. One open
  # issue per signal: repeats append to it. Not on a pull request, where the
  # red check already says it; a manual run is a person asking, and the body
  # names the ref.
  report-failure:
    needs: d2-gate
    if: always() && needs.d2-gate.result != 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The job writes issues; nothing else in this workflow may.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the D2 gate failure issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.d2-gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- ci-d2-gate-failure -->"
            echo "The D2 gate ended \`${RESULT}\` on \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\` (${GITHUB_EVENT_NAME}, [run ${GITHUB_RUN_ID}](${RUN_URL}))."
            echo
            echo "The run's summary page has each test's result and the criteria table; the \`d2-gate-record\` artifact has the build, compose and suite logs. Reproduce with \`scripts/d2-gate/run.sh\`. Close this issue once the failure is understood; the next failure opens a new one."
          } >body.md
          .github/scripts/upsert-ci-issue.sh ci-d2-gate-failure \
            "CI: D2 gate failed" body.md
