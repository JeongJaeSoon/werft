# The chart's default two replicas of the api and of the egress proxy, on
# kind: deploy/kind/replicas.sh calls each api Pod by its own port-forward and
# checks that the session flow (create, turn, permission wait and answer, SSE
# resume, a second turn) comes out right whichever replica a call lands on,
# with no turn run twice. It builds the three images, so it is heavier than
# the `k8s-smoke` job in ci.yml and stays off that path.
#
# Not a required check. The pull request trigger covers only the chart, the
# scripts and this file. The session flow it checks is product code outside
# that trigger, so it also runs every night on main, and a failure there
# opens an issue.
name: K8s replicas

on:
  schedule:
    # 04:07 KST, off the hour and apart from the other nightly checks.
    - cron: '7 19 * * *'
  pull_request:
    paths:
      - deploy/helm/werft/**
      - deploy/kind/replicas.sh
      - deploy/kind/up.sh
      - deploy/kind/lib.sh
      - .github/workflows/k8s-replicas.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-replicas-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  replicas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - name: kind, kubectl and helm
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo bin/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  bin/kind" | sha256sum -c -
          curl -fsSLo bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  bin/kubectl" | sha256sum -c -
          chmod +x bin/kind bin/kubectl
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: deploy/kind/replicas.sh
        env:
          CLUSTER_NAME: k8s-replicas
          STATE_DIR: ${{ runner.temp }}/kind
          KIND_NODE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/kind-node@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          REGISTRY_IMAGE: ghcr.io/jeongjaesoon/werft-ci/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          BUN_IMAGE: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
          BUILDKIT_SYNTAX: ghcr.io/jeongjaesoon/werft-ci/dockerfile@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e
          PROBE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        # The stand-ins come from the same mirror as the bun base.
        run: KIND_IMAGE_MIRROR="${BUN_IMAGE%/*}" deploy/kind/replicas.sh
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker

  # A job of its own, not a last step: a job timeout cancels every step left
  # in that job, so only another job still sees a run that hung. One open
  # issue per signal: repeats append to it. Not on a pull request, where the
  # red check already says it.
  report-failure:
    needs: replicas
    if: always() && needs.replicas.result != 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The job writes issues; nothing else in this workflow may.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the failure issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.replicas.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- ci-k8s-replicas-failure -->"
            echo "The two-replica session flow on kind ended \`${RESULT}\` on \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\` (${GITHUB_EVENT_NAME}, [run ${GITHUB_RUN_ID}](${RUN_URL}))."
            echo
            echo "It runs on pull requests only when the chart or its scripts change, so a product change merged since the last green night can be the cause. Reproduce with \`deploy/kind/replicas.sh\`."
          } >body.md
          .github/scripts/upsert-ci-issue.sh ci-k8s-replicas-failure \
            "CI: K8s replicas failed (nightly)" body.md
