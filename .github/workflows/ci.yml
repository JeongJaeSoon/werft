name: CI

on:
  # Branches without a PR can be checked through workflow_dispatch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: 'Which job to run. Anything but `all` skips the rest — use it when a manual run only needs one of them.'
        type: choice
        required: false
        default: all
        options: [all, check, integration, workspace-quota, e2e, conformance, quickstart, helm-chart, k8s-smoke, agent-sdk-compat, docs, demo, ui-pack, sdk-pack-smoke]
      allow_parallel:
        description: 'Allow independent parallel manual runs for deliberate flake testing (uses extra minutes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # PR updates supersede their previous validation. Main runs retain commit
  # identity because automatic releases wait for that exact CI run to pass.
  # Manual runs are deduplicated by ref, SHA and job selection.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && (github.event.inputs.allow_parallel == 'true' && github.run_id || format('{0}-{1}-{2}', github.ref, github.sha, github.event.inputs.only))) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      product: ${{ steps.plan.outputs.product }}
      site: ${{ steps.plan.outputs.site }}
      quickstart: ${{ steps.plan.outputs.quickstart }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      helm: ${{ steps.plan.outputs.helm }}
      k8s: ${{ steps.plan.outputs.k8s }}
      domains: ${{ steps.plan.outputs.domains }}
      sdk_pack: ${{ steps.sdk.outputs.run }}
      unit_parts: ${{ steps.units.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/ci-plan.sh
      - id: sdk
        name: Plan SDK consumer check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD >"$RUNNER_TEMP/sdk-pack-paths"
            run=false
            while IFS= read -r -d '' path; do
              case "$path" in
                packages/sdk/*|packages/client/*|packages/contracts/*|examples/*|scripts/sdk-pack-smoke.ts|LICENSE|bun.lock|.github/actions/bun-setup/*|.github/workflows/sdk-release.yml|.github/workflows/ci.yml)
                  run=true ;;
              esac
            done <"$RUNNER_TEMP/sdk-pack-paths"
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"
      - if: github.event.inputs.only == 'check' || steps.plan.outputs.domains == '["surface"]'
        uses: ./.github/actions/bun-setup
        with:
          restore-cache: "false"
      - id: units
        if: github.event.inputs.only == 'check' || steps.plan.outputs.domains == '["surface"]'
        env:
          DOMAINS: ${{ steps.plan.outputs.domains }}
          ONLY: ${{ github.event.inputs.only || 'all' }}
        run: |
          args=()
          if [ "$ONLY" != check ] && [ "$DOMAINS" = '["surface"]' ]; then
            args+=(--exclude-surface)
          fi
          matrix=$(bun .github/scripts/unit-part.ts matrix "${args[@]}")
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

  static:
    name: check (static)
    if: contains(fromJSON('["all","check"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
        with:
          save-cache: "true"
      - id: install
        run: bun install --frozen-lockfile
      - run: bun run typecheck
      - if: '!cancelled() && steps.install.outcome == ''success'''
        run: bun run lint
      - if: '!cancelled() && steps.install.outcome == ''success'''
        run: bun scripts/third-party-notices.ts --check

  docs-checks:
    needs: changes
    if: >-
      needs.changes.outputs.docs_only == 'true'
      && contains(fromJSON('["all","check"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: Repository policy and documentation tests
        run: bun test ./tests

  # Integration domains already run every unit test with their services on.
  # Manual checks keep all shards. The web plan runs only the complement
  # of surface, retaining policy tests without repeating surface files.
  check-part:
    name: check (${{ matrix.part }})
    needs: changes
    # A non-dispatch event has no `only`, so it reads as `all`.
    if: >-
      needs.changes.outputs.tests == 'true'
      && ((github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'check')
        || needs.changes.outputs.domains == '["surface"]')
      && contains(fromJSON('["all","check"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.unit_parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: Tests of this part
        env:
          UNIT: ${{ matrix.unit }}
          DOMAINS: ${{ needs.changes.outputs.domains }}
          ONLY: ${{ github.event.inputs.only || 'all' }}
        # An assignment, not process substitution, so a planner failure fails
        # the step instead of handing `bun test` an empty list — which it
        # would read as the whole suite.
        run: |
          args=()
          if [ "$ONLY" != check ] && [ "$DOMAINS" = '["surface"]' ]; then
            args+=(--exclude-surface)
          fi
          files=$(bun .github/scripts/unit-part.ts "$UNIT" "${args[@]}")
          mapfile -t files <<<"$files"
          bun test "${files[@]}"

  # A skipped required job counts as passing, so always emit an explicit verdict.
  check:
    needs: [changes, static, check-part, integration-domain, docs-checks, docs, demo, ui-pack, workspace-quota, helm-chart, k8s-smoke, pages]
    if: >-
      always()
      && contains(fromJSON('["all","check"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - id: verdict
        if: '!cancelled()'
        env:
          RESULT: ${{ (github.event.inputs.only == 'check' || needs.changes.outputs.domains == '["surface"]') && needs.check-part.result || needs.integration-domain.result }}
          PLAN: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          DOCS: ${{ needs.docs-checks.result }}
          TESTS: ${{ needs.changes.outputs.tests }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          [ "$PLAN" = success ] && [ "$STATIC" = success ] || exit 1
          case "$TESTS:$DOCS_ONLY:$RESULT:$DOCS" in
            true:false:success:skipped) echo "check: all planned tests passed" ;;
            false:true:skipped:success) echo "check: documentation policy tests passed; product tests are not needed" ;;
            *) echo "::error::invalid or failed check plan/results"; exit 1 ;;
          esac
      - id: product-results
        if: '!cancelled()'
        env:
          RESULTS: ${{ toJSON(needs) }}
          ONLY: ${{ github.event.inputs.only || 'all' }}
        run: |
          [ -n "$RESULTS" ] || exit 1
          if ! jq -e --arg only "$ONLY" '
            . as $needs
            | .changes.outputs as $plan
            | ($plan.domains | fromjson) as $domains
            | {
                "helm-chart": ($plan.helm == "true"),
                "k8s-smoke": ($plan.k8s == "true"),
                "docs": ($plan.site == "true"),
                "pages": ($plan.site == "true"),
                "demo": ($plan.product == "true"),
                "ui-pack": ($plan.product == "true"),
                "workspace-quota": ($plan.product == "true" and ($domains | index("docker") != null))
              } as $expected
            | (["all", "check"] | index($only) != null)
              and (.changes.result == "success")
              and all(.[]; .result == "success" or .result == "skipped")
              and (["helm", "k8s", "site", "product"] | all(.[]; $plan[.] == "true" or $plan[.] == "false"))
              and ($domains | type == "array" and all(.[]; type == "string"))
              and ($expected | to_entries | all(.[];
                $needs[.["key"]].result == (if $only == "all" and .value then "success" else "skipped" end)))
          ' <<<"$RESULTS" >/dev/null; then
            echo "::error::invalid product plan or job results; planned jobs must succeed and omitted jobs must be skipped"
            exit 1
          fi
      - id: cancelled
        if: cancelled()
        run: |
          echo "::error::workflow was cancelled"
          exit 1

  # integration-jobs.ts reads ownership from this matrix and rejects missing
  # or duplicate files and undeclared skips.
  integration-domain:
    name: integration (${{ matrix.domain }})
    needs: changes
    if: >-
      needs.changes.outputs.tests == 'true'
      && contains(fromJSON('["all","integration"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `docker` means the runner's own daemon, not a service container.
        include:
          # The PostgreSQL stores and the queue: unit and integration suites.
          - domain: db
            postgres: true
            localstack: false
            docker: false
            paths:
              - packages/db/
              - packages/testkit/src/postgres.
          # The session queue on PostgreSQL: sessions and their turns, the
          # scheduler's claims, worker leases and fencing, parked and pending
          # requests. Split from `db`, whose suite alone outran every other
          # job; the longer prefixes take these files from `packages/db/`.
          - domain: sessions
            postgres: true
            localstack: false
            docker: false
            paths:
              - packages/db/src/session
              - packages/db/src/scheduler/
              - packages/db/src/worker-unit-of-work.
              - packages/db/src/parked-requests.
              - packages/db/src/pending-
              - packages/db/src/reconcile.
          # HTTP routes and the control-host flows they drive. Keep their
          # database and lifecycle checks apart from API consumer suites.
          - domain: api
            postgres: true
            localstack: true
            docker: false
            paths:
              - apps/control-host/src/api/
              - apps/control-host/src/ingest/
              - apps/control-host/src/main
              - apps/control-host/src/metrics/
              - apps/control-host/src/pass-loop/
              - apps/control-host/src/reconciler/
              - packages/adapters/forge/
              - tests/catalog-mismatch.
              - tests/context-gap-flow.
              - tests/drain-park-flow.
              - tests/feature-gate-flow.
              - tests/interrupt-flow.
              - tests/lease-clock.
              - tests/park-resume-flow.
              - tests/tool-call-audit.
              - tests/turn-trace-context.
          # Slack and the contracts, clients and web apps that consume the API.
          # PostgreSQL only: no file here reads object storage, and LocalStack
          # took 30-39s to get ready for nothing. A file that comes to need it
          # skips without STORAGE_LOCALSTACK_TEST, which `verify` rejects.
          - domain: surface
            postgres: true
            localstack: false
            docker: false
            paths:
              - apps/control-host/src/slack/
              - packages/adapters/chat/
              - packages/contracts/
              - packages/client/
              - packages/sdk/
              - examples/
              - packages/core/
              - packages/react/
              - apps/web/
          # Object storage: checkpoint objects, the S3 transport and its bounds.
          - domain: storage
            postgres: false
            localstack: true
            docker: false
            paths:
              - packages/storage/
              - packages/testkit/src/localstack.
              - tests/checkpoint-flow.
              - tests/checkpoint-pins.
              - tests/object-store-cli.
              - tests/object-store-route.
              - tests/test-ops-bundle.
              - tests/test-ops.
              - tests/worker-checkpoint-publish.
            skips:
              # skipIf(linux): the runner can enforce the limits.
              - file: packages/storage/src/git-runner.test.ts
                test: where limits cannot be enforced git still runs, and says so once
          # Worker containers: the local-docker backend and its workspaces,
          # the scheduler that drives it, and the images and compose they run
          # as. Files are listed one by one under local-docker/src so that the
          # egress suite can be a job of its own.
          - domain: docker
            postgres: true
            localstack: false
            docker: true
            paths:
              - apps/control-host/src/scheduler/
              - packages/adapters/execution/local-docker/src/backend.
              - packages/adapters/execution/local-docker/src/config.
              - packages/adapters/execution/local-docker/src/docker-client.
              - packages/adapters/execution/local-docker/src/workspace
              - tests/backup-restore.
              - tests/images.
              - tests/scheduler-launch-claim.
          # What a worker may reach: the egress proxy and the isolated worker
          # networks. Split from `docker` because its suite alone runs ~70s,
          # most of it pulling the LocalStack image it starts as a container.
          - domain: egress
            postgres: false
            localstack: false
            docker: true
            paths:
              - apps/egress-proxy/
              - packages/adapters/execution/local-docker/src/egress.
              - tests/credential-routes.
              - tests/sdk-egress-proxy.
          # What runs inside a worker, none of it needing a service: the worker
          # process, runtime adapters, platform services — plus the UI component
          # library and the repository's own tooling suites, which need no
          # service either and are too small for a runner of their own.
          - domain: worker
            postgres: false
            localstack: false
            docker: false
            paths:
              - apps/worker/
              - packages/adapters/execution/kubernetes/
              - packages/adapters/runtimes/
              - packages/observability/
              - packages/platform/
              - packages/runtime-core/
              - packages/system/
              - packages/ui/
              - packages/testkit/src/fake-anthropic.
              - packages/testkit/src/fake-git.
              - packages/testkit/src/fake-github.
              - packages/testkit/src/fake-responses.
              - packages/testkit/src/scripted-messages.
              - packages/testkit/src/scripted-responses.
              - packages/testkit/src/workspace.
              - tests/agent-sdk-compat/
              - tests/architecture.
              - tests/ci-images.
              - tests/ci-services.
              - tests/ci-plan.
              - tests/ci-static-checks.
              - tests/install-rehearsal.
              - tests/receipt-agent-refs.
              - tests/d2-gate/
              - tests/dev/
              - tests/docs-i18n-code.
              - tests/docs-links.
              - tests/docs-meta-pairs.
              - tests/docs-reader-contract.
              - tests/docs-self-hosting-commands.
              - tests/docs-self-hosting-facts.
              - tests/docs-self-hosting-urls.
              - tests/docs-site-links.
              - tests/e2e/local-model.
              - tests/e2e/real-model.
              - tests/fetch-pinned.
              - tests/forbidden-terms.
              - tests/soak/
              - tests/ci-issue-scripts.
              - tests/integration-jobs.
              - tests/local-sh.
              - tests/pages-workflow.
              - tests/preview-reap.
              - tests/verify-werft-response-capture.
              - tests/release-auto.
              - tests/sdk-release.
              - tests/supply-chain.
              - tests/test-files.
              - tests/third-party-notices.
              - tests/ui-release.
              - tests/unit-part.
              - tests/verify-stack.
            skips:
              # The Kubernetes backend's suites need a kind cluster
              # (K8S_BACKEND_TEST=1 and a KUBECONFIG); the job that brings one
              # is `k8s-smoke`. (unnamed) is their beforeAll/afterAll.
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "(unnamed)"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "a delete conditioned on the replaced Pod's UID leaves the replacement running"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "a failed worker reports its exit, reason and log tail"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "terminating one generation leaves the next generation's Pod untouched"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "the nonce is in the Pod's own Secret only, never in the Pod"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "terminate and workspace removal leave no Pod, Secret or PVC of the session"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "(unnamed)"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "ensureExecution twice → one resource, adopted without a new nonce"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "inspect: found:false for nothing launched, running for a launch"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "listManaged returns what was launched and drops what was terminated"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "terminate: generation_mismatch, terminated, absent — only the matching generation"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "a resource removed out of band is re-created; terminate conditioned on the old providerRef leaves the replacement"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "a resource launched with another spec is refused with LaunchSpecMismatchError and left in place"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "workspace pair, when present: lists the session's workspace and removes it only once unused"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "assertReplaceable, when present: resolves for a launchable intent and launches nothing"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "reconcileNetworks, when present: clears what an out-of-band removal left, then has nothing to do"
              # The D2 gate needs the whole compose stack and the
              # images built from the checkout; scripts/d2-gate/run.sh runs it.
              # (unnamed) is its beforeAll/afterAll.
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "(unnamed)"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "A: two turns on one engine, checkpoint, restore onto a clean worker"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "B: a publish that fails at the manifest is never promoted"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "C: a transcript mirror error blocks the checkpoint and new input"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "D: a worker that loses its lease mid-turn promotes nothing"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "E: an accepted interrupt stops its turn, however early it lands"
              # sweep on the same stack; run against a stack kept by
              # D2_GATE_UP_ONLY=1 scripts/d2-gate/run.sh.
              - file: tests/d2-gate/reconciler-sweep.e2e.test.ts
                test: "(unnamed)"
              - file: tests/d2-gate/reconciler-sweep.e2e.test.ts
                test: "R1: a worker whose heartbeat stopped is fenced by the periodic pass and its turn settled unknown"
              - file: tests/d2-gate/reconciler-sweep.e2e.test.ts
                test: "R2: an interrupt its heartbeating worker cannot settle is sent to terminate and its receipt ends unknown"
              # control host roles, on the same kept stack.
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "(unnamed)"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H1: one image runs the three roles and only the scheduler holds the Docker socket"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H2: a scheduler restarted mid-turn ends no worker and launches none twice"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H3: the api and reconciler come back from a restart and the session takes its next turn"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H4: with PostgreSQL down the loops fail their passes, and recover once it is back"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H5: a scheduler without Docker reserves nothing, and the real one launches the waiting session once"
    # Every third-party image in this workflow comes from ghcr.io, not Docker
    # Hub, pinned by its upstream digest: ci-image-mirror.yml copies it there
    # . These point the suites that pull their own images at it
    # instead of their Docker Hub defaults; unused where no daemon runs.
    env:
      BUN_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
      DOCKER_BACKEND_TEST_HELPER_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      DOCKER_BACKEND_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      EGRESS_CURL_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
      EGRESS_PROXY_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
      EXECUTION_WORKSPACE_MIGRATION_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      LOCALSTACK_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/localstack@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    steps:
      # A job-level `if` cannot read the matrix, and the entries stay declared
      # here once for integration-jobs.ts, so a domain no changed path reaches
      # still starts, ends in seconds, and reports success. Every step below
      # waits on this one.
      - id: gate
        env:
          PLANNED: ${{ contains(fromJSON(needs.changes.outputs.domains), matrix.domain) }}
        run: echo "run=$PLANNED" >>"$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not `services:`, which the runner starts one by one before the first
      # step and polls on a 2·4·8s backoff (46s for api). From here the pulls
      # overlap each other and the install below; `wait` then probes every
      # second, and fails with the container's log if one never gets ready.
      - if: steps.gate.outputs.run == 'true' && (matrix.postgres || matrix.localstack)
        env:
          POSTGRES: ${{ matrix.postgres }}
          LOCALSTACK: ${{ matrix.localstack }}
          POSTGRES_SERVICE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
          LOCALSTACK_SERVICE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/localstack@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
        run: .github/scripts/ci-services.sh start
      - if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/bun-setup
      - if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile
      # Unset rather than empty where the service is absent: a test reading
      # `?? default` would take an empty string as a value.
      - if: steps.gate.outputs.run == 'true'
        name: Opt-in variables of this job's services
        env:
          POSTGRES: ${{ matrix.postgres }}
          LOCALSTACK: ${{ matrix.localstack }}
          DOCKER: ${{ matrix.docker }}
        run: |
          {
            if [ "$POSTGRES" = true ]; then
              echo "QUEUE_DATABASE_URL=postgresql://postgres:dev@127.0.0.1:5432/sessions"
            fi
            if [ "$LOCALSTACK" = true ]; then
              echo "AWS_ACCESS_KEY_ID=test"
              echo "AWS_ENDPOINT_URL=http://127.0.0.1:4566"
              echo "AWS_REGION=ap-northeast-1"
              echo "AWS_SECRET_ACCESS_KEY=test"
              echo "S3_BUCKET=claude-sessions"
              echo "STORAGE_LOCALSTACK_TEST=1"
            fi
            # ubuntu runners ship a Docker daemon: run the LocalDockerBackend
            # integration tests against it (busybox) instead of skipping them.
            if [ "$DOCKER" = true ]; then
              echo "DOCKER_BACKEND_TEST=1"
            fi
          } >>"$GITHUB_ENV"
      # A Docker call that stalls on the runner leaves nothing behind once the
      # VM is gone, and the client only sees its own timeout. The
      # daemon's events say whether the container got as far as starting; the
      # step after the tests keeps them, with the daemon's log, when it fails.
      - if: steps.gate.outputs.run == 'true' && matrix.docker
        name: Record the daemon's events
        run: |
          echo "DOCKER_EVENTS_SINCE=$(date -u '+%Y-%m-%d %H:%M:%S')" >>"$GITHUB_ENV"
          nohup docker events --format '{{json .}}' >"$RUNNER_TEMP/docker-events.jsonl" 2>&1 &
      - if: steps.gate.outputs.run == 'true' && (matrix.postgres || matrix.localstack)
        env:
          POSTGRES: ${{ matrix.postgres }}
          LOCALSTACK: ${{ matrix.localstack }}
        run: .github/scripts/ci-services.sh wait
      - if: steps.gate.outputs.run == 'true'
        name: Tests of this domain
        env:
          DOMAIN: ${{ matrix.domain }}
        # An assignment, not process substitution, so a failed assignment
        # fails the step instead of handing `bun test` an empty list — which it
        # would read as the whole suite.
        run: |
          files=$(bun .github/scripts/integration-jobs.ts files "$DOMAIN")
          mapfile -t files <<<"$files"
          bun test --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit.xml" "${files[@]}"
          bun .github/scripts/integration-jobs.ts verify "$DOMAIN" "$RUNNER_TEMP/junit.xml"
      # Whatever the suites pulled, by whatever path: none of it from Docker
      # Hub. Also after a failure — such a pull is worth knowing about anyway.
      - if: steps.gate.outputs.run == 'true' && !cancelled()
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      # SIGUSR1 makes dockerd write every goroutine's stack, so a call still
      # stuck when the tests gave up shows where it is waiting.
      - if: failure() && matrix.docker
        name: Keep the daemon's record of a failed run
        run: |
          sudo kill -USR1 "$(pidof dockerd)" || true
          sleep 2
          sudo journalctl -u docker -u containerd --since "$DOCKER_EVENTS_SINCE" --no-pager -o short-iso-precise >"$RUNNER_TEMP/docker-daemon.log" || true
          sudo sh -c "cp /var/run/docker/goroutine-stacks-*.log '$RUNNER_TEMP/' 2>/dev/null" || true
          sudo chmod a+r "$RUNNER_TEMP"/docker-* "$RUNNER_TEMP"/goroutine-stacks-*.log 2>/dev/null || true
      - if: failure() && matrix.docker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-daemon-${{ matrix.domain }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/docker-events.jsonl
            ${{ runner.temp }}/docker-daemon.log
            ${{ runner.temp }}/goroutine-stacks-*.log
          if-no-files-found: ignore
          retention-days: 14
      - if: always() && steps.gate.outputs.run == 'true'
        run: .github/scripts/ci-services.sh stop

  # Heavy jobs stay cancellable; this required gate rejects missing or cancelled results.
  integration:
    needs: [changes, integration-domain, e2e, conformance, quickstart]
    if: >-
      always()
      && contains(fromJSON('["all","integration"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - id: verdict
        if: '!cancelled()'
        env:
          RESULT: ${{ needs.integration-domain.result }}
          E2E: ${{ needs.e2e.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
          QUICKSTART: ${{ needs.quickstart.result }}
          EVENT: ${{ github.event_name }}
          ONLY: ${{ github.event.inputs.only || 'all' }}
          PLAN: ${{ needs.changes.result }}
          TESTS: ${{ needs.changes.outputs.tests }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          [ "$PLAN" = success ] || exit 1
          case "$EVENT:$ONLY:$E2E:$CONFORMANCE:$QUICKSTART" in
            pull_request:all:success:success:success | push:all:success:success:success | workflow_dispatch:all:success:success:success) ;;
            workflow_dispatch:integration:skipped:skipped:skipped) ;;
            *) echo "::error::required scenario or guide jobs did not pass"; exit 1 ;;
          esac
          case "$TESTS:$DOCS_ONLY:$RESULT" in
            true:false:success) echo "integration: all domains passed" ;;
            false:true:skipped) echo "integration: documentation-only PR; no product test inputs changed" ;;
            *) echo "::error::invalid or failed integration plan/results"; exit 1 ;;
          esac
      - id: cancelled
        if: cancelled()
        run: |
          echo "::error::workflow was cancelled"
          exit 1

  # apps/docs: the Fumadocs site, a Next.js static export.
  docs:
    needs: changes
    if: >-
      needs.changes.outputs.site == 'true'
      && github.event_name != 'push'
      && contains(fromJSON('["all","docs"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      # next build runs on Node; pinned, not the image's own.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - id: docs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.next/cache
          key: next-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/src/**', 'apps/docs/content/**', 'apps/docs/*.ts', 'apps/docs/*.json', 'apps/docs/*.mjs', 'docs/openapi.json') }}
          restore-keys: next-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-
      - name: Static build
        run: bun run --cwd apps/docs build
      - name: Self-hosting public URL and fallback contract
        run: bun run scripts/check-docs-self-hosting-export.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-out
          path: apps/docs/out
          retention-days: 1

  # The read-only console demo mode, built on the placeholder fixture.
  demo:
    needs: changes
    if: >-
      needs.changes.outputs.product == 'true'
      && contains(fromJSON('["all","demo"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: Static build
        run: bun run --cwd apps/web build:demo

  # packages/ui as an outside app gets it: the built package, packed, installed
  # from the tarball into an empty Vite + React app with no Tailwind, which
  # must type-check with skipLibCheck off, build, and render a styled Button in
  # the runner's Chrome. Nothing is published.
  ui-pack:
    needs: changes
    if: >-
      needs.changes.outputs.product == 'true'
      && contains(fromJSON('["all","ui-pack"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      # The consumer's toolchain is npm's, as an outside app's would be.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The consumer pins its direct dependencies in the script, so the
      # script is the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ui-pack-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ui-pack-smoke.ts') }}
          restore-keys: ui-pack-npm-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build the package
        run: bun run --cwd packages/ui build:package
      - name: Files the tarball would carry
        run: npm pack --dry-run ./packages/ui/dist
      - name: Install, type-check, build and render in an empty app
        run: bun scripts/ui-pack-smoke.ts --screenshot "$RUNNER_TEMP/ui-pack-button.png"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-pack-button
          path: ${{ runner.temp }}/ui-pack-button.png
          retention-days: 7

  # Preserve the release workflow's PR consumer check without publishing.
  sdk-pack-smoke:
    needs: changes
    if: >-
      needs.changes.outputs.sdk_pack == 'true'
      && contains(fromJSON('["all","sdk-pack-smoke"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun test packages/sdk examples
      - name: SDK_VERSION matches package.json
        run: |
          version=$(node -p 'require("./packages/sdk/package.json").version')
          grep -qx "export const SDK_VERSION = \"${version}\";" packages/sdk/src/version.ts \
            || { echo "::error::SDK_VERSION does not match packages/sdk/package.json"; exit 1; }
      - run: bun run --cwd packages/sdk build:package
      - name: The bundle reports the version it is published as
        run: |
          version=$(node -p 'require("./packages/sdk/dist/package.json").version')
          grep -qF "\"${version}\"" packages/sdk/dist/index.js \
            || { echo "::error::SDK bundle does not carry its package version"; exit 1; }
      - name: Install, type-check and run the sample in an empty project
        run: bun scripts/sdk-pack-smoke.ts

  # Assemble the current run's artifacts to prove the deploy layout: the
  # docs site at the root, the Scalar reference beside it
  # (scripts/pages-site.sh, the same assembly pages.yml deploys). Pull
  # requests and manual runs only; the deploy is pages.yml's.
  pages:
    needs: [docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-out
          path: docs-out
      - name: Pages site layout
        run: scripts/pages-site.sh docs-out _site
      # GitHub Pages documents a 1 GB limit on a published site, and the Pages
      # deployment stalled in the queue when the site was ~1.3 GB. Fail here, on the
      # pull request, instead of on the main deploy.
      - name: Pages site stays under its size budget
        run: |
          mb=$(du -sm _site | cut -f1)
          echo "_site is ${mb} MB in $(find _site -type f | wc -l) files"
          [ "$mb" -le 900 ] \
            || { echo "::error::_site is ${mb} MB; the budget is 900 MB (Pages limit 1 GB)"; exit 1; }

  # The only place the workspace byte ceiling can actually be exercised. The
  # `local` volume driver honours `size` only when the storage under the
  # daemon can carry a project quota, and neither daemon the repo otherwise
  # runs on can: Docker Desktop's kernel has no XFS quota support, and this
  # runner's own data root is on ext4. So the job builds one that can — xfs
  # with prjquota on a loop file, handed to a nested daemon as its data root —
  # and points the workspace suite at it. Everywhere else that suite asserts
  # the other half of the contract: refusing to start rather than running
  # unbounded.
  workspace-quota:
    needs: changes
    if: >-
      !cancelled()
      && needs.changes.outputs.product == 'true'
      && contains(fromJSON(needs.changes.outputs.domains), 'docker')
      && contains(fromJSON('["all","workspace-quota"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: Project-quota filesystem
        run: |
          command -v mkfs.xfs >/dev/null || {
            sudo apt-get update && sudo apt-get install -y xfsprogs
          }
          sudo truncate -s 8G /xfs.img
          sudo mkfs.xfs -q /xfs.img
          sudo mkdir -p /mnt/xfs
          sudo mount -o loop,prjquota /xfs.img /mnt/xfs
          # Fail here rather than three steps later with a confusing 400.
          mount | grep -q 'on /mnt/xfs .*prjquota'
      - name: Daemon on that filesystem
        run: |
          mkdir -p /tmp/apq
          docker run -d --privileged --name apq \
            -e DOCKER_TLS_CERTDIR= \
            -v /mnt/xfs:/var/lib/docker \
            -v /tmp/apq:/sock \
            ghcr.io/jeongjaesoon/werft-ci/docker@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac \
            --host=unix:///sock/docker.sock
          for _ in $(seq 1 60); do
            docker exec apq docker version >/dev/null 2>&1 && break
            sleep 2
          done
          sudo chmod 666 /tmp/apq/docker.sock
          docker exec apq docker info --format 'driver={{.Driver}} root={{.DockerRootDir}}'
          # Prove the capability before any test claims to have used it.
          docker exec apq docker volume create --driver local --opt size=64m apq-probe
          docker exec apq docker volume rm apq-probe
      # The scheduler runs the inode helper from the worker image.
      # Building all of that here would spend minutes on the SDK closure for
      # one apt package, so this is the worker's own pinned base (from the
      # mirror; tests/ci-images.test.ts holds it to the Dockerfile's digest)
      # with the same xfsprogs and the same declared VOLUME; image-smoke.sh
      # checks the real worker image carries the tools.
      - name: Inode helper image on that daemon
        run: |
          printf '%s\n' \
            "FROM ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4" \
            "RUN apt-get update && apt-get install -y --no-install-recommends xfsprogs && rm -rf /var/lib/apt/lists/*" \
            'VOLUME ["/workspace"]' \
            | docker exec -i apq docker build -q -t ap-inode-helper:ci -
      - name: Workspace suite against a quota-capable daemon
        env:
          DOCKER_BACKEND_TEST: "1"
          DOCKER_BACKEND_TEST_HELPER_IMAGE: ap-inode-helper:ci
          DOCKER_BACKEND_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          DOCKER_HOST: unix:///tmp/apq/docker.sock
          EXECUTION_WORKSPACE_MIGRATION_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        run: >-
          bun test
          packages/adapters/execution/local-docker/src/workspace.integration.test.ts
          packages/adapters/execution/local-docker/src/workspace-migration.integration.test.ts
      # Both daemons: the runner's holds the dind image, the nested one what
      # the suite pulled.
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: |
          .github/scripts/assert-no-docker-hub-images.sh docker
          .github/scripts/assert-no-docker-hub-images.sh env DOCKER_HOST=unix:///tmp/apq/docker.sock docker
      # The daemon's own log is where a create that the suite could not
      # explain shows up. `|| true` because this step also runs when an
      # earlier one failed before the container existed.
      - if: always()
        run: |
          docker logs apq 2>&1 | tail -40 || true
          docker rm -f apq || true

  # Exercise the real worker CLI against the compose fake Messages API.
  # The scenario records the tested SHA, images and declared skips.
  e2e:
    needs: changes
    if: >-
      !cancelled()
      && contains(fromJSON('["all","e2e"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate product test plan
        if: '!cancelled()'
        env:
          PLAN: ${{ needs.changes.result }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          [ "$PLAN" = success ] || exit 1
          case "$PRODUCT:$DOCS_ONLY" in
            true:false) echo "e2e: product inputs changed; running the complete scenario" ;;
            false:true) echo "e2e: documentation-only PR; product inputs unchanged" ;;
            *) echo "::error::invalid product test plan"; exit 1 ;;
          esac
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        uses: ./.github/actions/bun-setup
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        run: bun install --frozen-lockfile
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        uses: ./.github/actions/image-cache
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        id: scenario
        name: Alpha path against the compose stack
        env:
          E2E_COMPOSE_OVERRIDE: tests/e2e/compose.ci-mirror.yml
          E2E_COMPOSE_CACHE: tests/e2e/compose.ci-cache.yml
          E2E_OUT: ${{ runner.temp }}/e2e
        run: tests/e2e/run.sh
      # run.sh removes the images it built; what compose pulled stays.
      - if: '!cancelled() && needs.changes.outputs.product == ''true'''
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      # Compose, worker and suite logs: the worker containers are gone by
      # now, so this is the only copy of what they printed.
      - if: always() && needs.changes.outputs.product == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-record
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 14
      - id: verdict
        name: Required scenario verdict
        if: always() && !cancelled()
        env:
          PLAN: ${{ needs.changes.result }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SCENARIO: ${{ steps.scenario.outcome }}
        run: |
          [ "$PLAN" = success ] || exit 1
          case "$PRODUCT:$DOCS_ONLY:$SCENARIO" in
            true:false:success) echo "e2e: scenario passed" ;;
            false:true:skipped) echo "e2e: intentionally omitted for documentation-only inputs" ;;
            *) echo "::error::required e2e scenario did not pass"; exit 1 ;;
          esac
      - id: cancelled
        if: cancelled()
        run: |
          echo "::error::workflow was cancelled"
          exit 1

  # The engine-parametrized conformance suite (tests/conformance): the same
  # scenarios on each runtime engine's own worker image and fake provider.
  # The two engines run in parallel as matrix entries rather than one after
  # the other in a single job.
  conformance:
    name: conformance (${{ matrix.engine }})
    needs: changes
    if: >-
      !cancelled()
      && contains(fromJSON('["all","conformance"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [claude_agent_sdk, codex_app_server]
    steps:
      - name: Validate product test plan
        if: '!cancelled()'
        env:
          PLAN: ${{ needs.changes.result }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          [ "$PLAN" = success ] || exit 1
          case "$PRODUCT:$DOCS_ONLY" in
            true:false) echo "conformance: product inputs changed; running the suite" ;;
            false:true) echo "conformance: documentation-only PR; product inputs unchanged" ;;
            *) echo "::error::invalid product test plan"; exit 1 ;;
          esac
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        uses: ./.github/actions/bun-setup
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        run: bun install --frozen-lockfile
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        uses: ./.github/actions/image-cache
      - if: success() && !cancelled() && needs.changes.outputs.product == 'true'
        id: scenario
        name: Conformance suite against the compose stack
        env:
          E2E_COMPOSE_OVERRIDE: tests/e2e/compose.ci-mirror.yml
          E2E_COMPOSE_CACHE: tests/e2e/compose.ci-cache.yml
          E2E_OUT: ${{ runner.temp }}/conformance
        run: tests/e2e/run.sh --conformance ${{ matrix.engine }}
      - if: '!cancelled() && needs.changes.outputs.product == ''true'''
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      - if: always() && needs.changes.outputs.product == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-record-${{ matrix.engine }}
          path: ${{ runner.temp }}/conformance
          if-no-files-found: ignore
          retention-days: 14
      - id: verdict
        name: Required scenario verdict
        if: always() && !cancelled()
        env:
          PLAN: ${{ needs.changes.result }}
          PRODUCT: ${{ needs.changes.outputs.product }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SCENARIO: ${{ steps.scenario.outcome }}
        run: |
          [ "$PLAN" = success ] || exit 1
          case "$PRODUCT:$DOCS_ONLY:$SCENARIO" in
            true:false:success) echo "conformance: suite passed" ;;
            false:true:skipped) echo "conformance: intentionally omitted for documentation-only inputs" ;;
            *) echo "::error::required conformance suite did not pass"; exit 1 ;;
          esac
      - id: cancelled
        if: cancelled()
        run: |
          echo "::error::workflow was cancelled"
          exit 1

  # Execute both guides as written, with the CI mirror compose overlay.
  quickstart:
    needs: changes
    if: >-
      !cancelled()
      && contains(fromJSON('["all","quickstart"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate executable guide plan
        if: '!cancelled()'
        env:
          PLAN: ${{ needs.changes.result }}
          QUICKSTART: ${{ needs.changes.outputs.quickstart }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          [ "$PLAN" = success ] || exit 1
          case "$QUICKSTART:$DOCS_ONLY" in
            true:true | true:false) echo "quickstart: product or guide inputs changed; running both guides" ;;
            false:true) echo "quickstart: documentation-only PR; executable guides unchanged" ;;
            false:false) echo "quickstart: changed paths reach neither the images nor the guides" ;;
            *) echo "::error::invalid executable guide plan"; exit 1 ;;
          esac
      - if: success() && !cancelled() && needs.changes.outputs.quickstart == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: success() && !cancelled() && needs.changes.outputs.quickstart == 'true'
        uses: ./.github/actions/image-cache
      - if: success() && !cancelled() && needs.changes.outputs.quickstart == 'true'
        id: guide
        name: docs/quickstart.md
        env:
          COMPOSE_FILE: compose.yaml:tests/e2e/compose.ci-mirror.yml:tests/e2e/compose.ci-cache.yml
          QUICKSTART_OUT: ${{ runner.temp }}/quickstart
        run: tests/e2e/quickstart.sh
      - if: success() && !cancelled() && needs.changes.outputs.quickstart == 'true'
        id: api-guide
        name: reference/api-guide.mdx
        env:
          COMPOSE_FILE: compose.yaml:tests/e2e/compose.ci-mirror.yml:tests/e2e/compose.ci-cache.yml
          QUICKSTART_OUT: ${{ runner.temp }}/api-guide
        run: tests/e2e/quickstart.sh apps/docs/content/docs/reference/api-guide.mdx
      # On the containerd image store (.github/actions/image-cache) an image
      # built on the daemon carries a RepoDigest as well, which the check
      # below reads as a pull. The guides build only the compose project's
      # werft-* images and pull none by that name; `scripts/local.sh down`
      # keeps them, so they go before the check.
      - if: '!cancelled() && needs.changes.outputs.quickstart == ''true'''
        name: Remove the images the guides built
        run: |
          built="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^werft-[a-z-]+:' || true)"
          echo "built by the guides: ${built:-(none)}"
          # shellcheck disable=SC2086 # one argument per image
          [ -z "$built" ] || docker image rm $built
      - if: '!cancelled() && needs.changes.outputs.quickstart == ''true'''
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      - if: always() && needs.changes.outputs.quickstart == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickstart-record
          path: |
            ${{ runner.temp }}/quickstart
            ${{ runner.temp }}/api-guide
          if-no-files-found: ignore
          retention-days: 14
      - id: verdict
        name: Required guide verdict
        if: always() && !cancelled()
        env:
          PLAN: ${{ needs.changes.result }}
          QUICKSTART: ${{ needs.changes.outputs.quickstart }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          GUIDE: ${{ steps.guide.outcome }}
          API_GUIDE: ${{ steps.api-guide.outcome }}
        run: |
          [ "$PLAN" = success ] || exit 1
          case "$QUICKSTART:$DOCS_ONLY:$GUIDE:$API_GUIDE" in
            true:false:success:success | true:true:success:success) echo "quickstart: both guides passed" ;;
            false:true:skipped:skipped | false:false:skipped:skipped) echo "quickstart: intentionally omitted; executable guides unchanged" ;;
            *) echo "::error::required executable guide did not pass"; exit 1 ;;
          esac
      - id: cancelled
        if: cancelled()
        run: |
          echo "::error::workflow was cancelled"
          exit 1

  # Validate the chart against pinned Kubernetes and CRD schemas.
  helm-chart:
    needs: changes
    if: >-
      needs.changes.outputs.helm == 'true'
      && contains(fromJSON('["all","helm-chart"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The schemas, by commit: kubeconform's default and the CRD catalog
      # (ExternalSecret) both follow a branch otherwise.
      K8S_SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/817113f21a2643311cbc3e992bb44ffe1c416c54/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs nothing; render-check.ts imports only node: built-ins and
      # files of this repository: no cache to restore.
      - uses: ./.github/actions/bun-setup
        with:
          restore-cache: "false"
      - name: helm and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm
          bun "$GITHUB_WORKSPACE/scripts/fetch-pinned.ts" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            "$KUBECONFORM_SHA256" kubeconform.tgz \
            https://api.github.com/repos/yannh/kubeconform/releases/assets/438612666
          tar -xzf kubeconform.tgz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: helm lint
        run: |
          helm lint --strict deploy/helm/werft -f deploy/helm/ci-digests.yaml
          helm lint --strict deploy/helm/werft -f deploy/helm/ci-digests.yaml \
            -f deploy/helm/werft/values-aws.example.yaml
      - name: Render check
        run: bun deploy/helm/render-check.ts
      - name: kubeconform
        run: |
          set -o pipefail
          for values in deploy/helm/ci-digests.yaml deploy/helm/werft/values-aws.example.yaml; do
            echo "== $values"
            helm template ap deploy/helm/werft -f deploy/helm/ci-digests.yaml -f "$values" \
              | kubeconform -strict -summary -kubernetes-version 1.33.0 \
                  -schema-location "$K8S_SCHEMAS" -schema-location "$CRD_SCHEMAS"
          done

  # Check installation, worker lifecycle, NetworkPolicy and backend contracts
  # against kind using images from the CI mirror.
  k8s-smoke:
    needs: changes
    if: >-
      needs.changes.outputs.k8s == 'true'
      && contains(fromJSON('["all","k8s-smoke"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: kind, kubectl and helm
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo bin/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  bin/kind" | sha256sum -c -
          curl -fsSLo bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  bin/kubectl" | sha256sum -c -
          chmod +x bin/kind bin/kubectl
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: ./.github/actions/image-cache
      - name: deploy/kind/smoke.sh
        env:
          CLUSTER_NAME: k8s-smoke
          IMAGE_CACHE_ARCH: amd64
          STATE_DIR: ${{ runner.temp }}/kind
          KIND_NODE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/kind-node@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          REGISTRY_IMAGE: ghcr.io/jeongjaesoon/werft-ci/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          BUN_IMAGE: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
          BUILDKIT_SYNTAX: ghcr.io/jeongjaesoon/werft-ci/dockerfile@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e
          PROBE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          K8S_BACKEND_TEST_IMAGE: ghcr.io/jeongjaesoon/werft-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        # The stand-ins come from the same mirror as the bun base.
        run: KIND_IMAGE_MIRROR="${BUN_IMAGE%/*}" deploy/kind/smoke.sh
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker

  # Non-blocking main/manual compatibility probe; failures are reported as issues.
  # It is absent on PRs, so it must not become a required check.
  agent-sdk-compat:
    needs: [changes, static]
    # The job writes issues; nothing else in this workflow may.
    permissions:
      contents: read
      issues: write
    if: >-
      !cancelled() && needs.static.result != 'failure'
      && needs.changes.outputs.product == 'true'
      && github.event_name != 'pull_request'
      && contains(fromJSON('["all","agent-sdk-compat"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
        with:
          cache-scope: agent-sdk-compat
          save-cache: "true"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # The harness imports packages/testkit by relative path, so it needs the
      # root workspace installed as well as its own lockfile.
      - run: bun install --frozen-lockfile
      - run: bun install --cwd scripts/agent-sdk-compat --frozen-lockfile
      - run: uv tool install 'litellm[proxy]==1.100.1'
      - run: bun run --cwd scripts/agent-sdk-compat probe:version
      - id: harness
        name: agent-sdk-compat check
        run: bun run --cwd scripts/agent-sdk-compat check
      # continue-on-error leaves the run green, so whoever reads only the run
      # conclusion never learns the harness broke. State the outcome on the
      # summary page on every run that was not cancelled.
      - if: '!cancelled()'
        name: Report harness outcome
        env:
          HARNESS: ${{ steps.harness.outcome }}
        run: |
          {
            echo "### agent-sdk-compat (non-blocking)"
            echo
            echo "| suite | outcome |"
            echo "| --- | --- |"
            echo "| scripts/agent-sdk-compat | ${HARNESS} |"
            echo
            echo "This job never fails the run. A \`failure\` above still needs a look."
          } >>"$GITHUB_STEP_SUMMARY"
      # Use step outcomes because continue-on-error keeps the run green.
      # Report setup failures too; the main-push monitor covers timeouts and cancellations.
      # Manual probes must report failures too, so this step is not gated to push/main.
      - if: >-
          !cancelled()
          && steps.harness.outcome != 'success'
        name: Open or update the agent-sdk-compat failure issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HARNESS: ${{ steps.harness.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- ci-agent-sdk-compat-failure -->"
            echo "\`agent-sdk-compat\` failed on \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\` (${GITHUB_EVENT_NAME}, [run ${GITHUB_RUN_ID}](${RUN_URL}))."
            echo
            echo "| suite | outcome |"
            echo "| --- | --- |"
            echo "| scripts/agent-sdk-compat | ${HARNESS} |"
            echo
            echo "The run itself is green (\`continue-on-error\`). Close this issue once the failure is understood; the next failure reopens a new one."
          } >body.md
          .github/scripts/upsert-ci-issue.sh ci-agent-sdk-compat-failure \
            "CI: agent-sdk-compat failed (non-blocking job)" body.md
