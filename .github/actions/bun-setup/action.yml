name: Bun setup
description: Pin the Bun version and restore the matching ~/.bun/install/cache.

inputs:
  cache-scope:
    description: >-
      Which set of lockfiles this job installs. `root` covers bun.lock alone;
      `agent-sdk-compat` covers bun.lock plus scripts/agent-sdk-compat/bun.lock.
      The scope picks the cache key, so a key never promises more than its
      writer installed.
    default: root
  save-cache:
    description: >-
      One job per scope writes its cache; the rest restore it, so that parallel
      jobs never race on the same key. Pull requests always restore only.
    default: "false"
  restore-cache:
    description: >-
      `"false"` skips the cache restore, for a job that installs nothing and
      whose scripts import only node: built-ins and files of this repository
      (Bun fetches any other import into this cache). It also skips the save,
      so it cannot be combined with `save-cache: "true"`.
    default: "true"

runs:
  using: composite
  steps:
    - if: inputs.restore-cache == 'false' && inputs.save-cache == 'true'
      shell: bash
      run: |
        echo "::error::restore-cache: false skips the cache step, so save-cache: true would save nothing"
        exit 1

    - id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - id: key
      shell: bash
      # The Bun version and the runner architecture belong in the key: the cache
      # holds resolved, platform-specific packages.
      env:
        ROOT_KEY: bun-root-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
        SCOPE: ${{ inputs.cache-scope }}
        COMPAT_KEY: bun-agent-sdk-compat-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock', 'scripts/agent-sdk-compat/bun.lock') }}
      run: |
        if [ "$SCOPE" = agent-sdk-compat ]; then
          echo "cache=$COMPAT_KEY" >>"$GITHUB_OUTPUT"
          echo "restore=bun-agent-sdk-compat-${{ runner.os }}-${{ runner.arch }}-1.3.14-" >>"$GITHUB_OUTPUT"
        else
          echo "cache=$ROOT_KEY" >>"$GITHUB_OUTPUT"
          echo "restore=bun-root-${{ runner.os }}-${{ runner.arch }}-1.3.14-" >>"$GITHUB_OUTPUT"
        fi

    - id: writer
      if: inputs.restore-cache != 'false' && inputs.save-cache == 'true' && github.event_name != 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.key.outputs.cache }}
        restore-keys: ${{ steps.key.outputs.restore }}

    - id: reader
      if: inputs.restore-cache != 'false' && (inputs.save-cache != 'true' || github.event_name == 'pull_request')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.key.outputs.cache }}
        restore-keys: ${{ steps.key.outputs.restore }}

    - if: inputs.restore-cache != 'false'
      name: Cache restore result
      shell: bash
      env:
        CACHE_KEY: ${{ steps.key.outputs.cache }}
        CACHE_HIT: ${{ steps.writer.outputs.cache-hit || steps.reader.outputs.cache-hit || 'false' }}
        EVENT: ${{ github.event_name }}
        EXECUTABLE_HIT: ${{ steps.bun.outputs.cache-hit || 'false' }}
      run: echo "Bun cache key=$CACHE_KEY exact-hit=$CACHE_HIT executable-hit=$EXECUTABLE_HIT event=$EVENT"
