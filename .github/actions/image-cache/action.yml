name: Image build cache (read only)
description: >-
  Lets this job's app image builds read the buildkit layer cache that
  images.yml writes on main (scope images-<app>-<arch>). Reading only: PR code
  must not write that cache (docs/contributing/ci.md), so the compose overlay
  and up.sh name `cache_from` and never a cache to write. A build that cannot
  read the cache builds the way it did without it.

runs:
  using: composite
  steps:
    # The default docker driver imports a `type=gha` cache only on the
    # containerd image store; a docker-container builder would instead pay a
    # tarball `--load` for every image compose builds.
    - name: Docker's containerd image store
      shell: bash
      run: |
        config=/etc/docker/daemon.json
        current="$(sudo cat "$config" 2>/dev/null || true)"
        [ -n "$current" ] || current='{}'
        printf '%s\n' "$current" | jq '.features["containerd-snapshotter"] = true' >"$RUNNER_TEMP/daemon.json"
        sudo install -m 644 "$RUNNER_TEMP/daemon.json" "$config"
        sudo systemctl restart docker
        for _ in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
        status="$(docker info -f '{{json .DriverStatus}}')"
        echo "docker storage: ${status}"
        [[ "$status" == *io.containerd.snapshotter* ]] || {
          echo "::error::docker did not come back on the containerd image store"
          exit 1
        }
    - uses: ./.github/actions/image-cache-runtime
    # images.yml builds with the day's key; another key misses every layer
    # from the `apt-get upgrade` down.
    - name: The day's apt key
      shell: bash
      run: echo "APT_UPGRADE_KEY=$(date -u +%F)" >>"$GITHUB_ENV"
