# Laid over the chart's defaults for a kind check (up.sh): the stand-ins in
# deps.yaml as the object store, and the images up.sh pushed to the local
# registry. up.sh sets the repositories and digests on the command line.
config:
  aws:
    endpointUrl: http://localstack:4566
  egress:
    credentialPrivateAllowlist: "localstack:4566"
# BOOTSTRAP_TOKEN joins the api's environment so the checks can release
# their agent as the first owner (release-key.sh); up.sh writes it.
secrets:
  catalogEnv: [ANTHROPIC_API_KEY, BOOTSTRAP_TOKEN]
