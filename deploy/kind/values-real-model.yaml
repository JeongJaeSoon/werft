# Laid over values.yaml for KIND_MODEL=real (smoke.sh): the real-model
# settings' anthropic connection against the sample repository of
# deps-session.yaml, under infra/compose.real-model.yml's limits.
config:
  aws:
    secretsManagerEndpointUrl: http://secrets:4566
  limits:
    SESSION_COST_LIMIT_USD: 1
    MAX_TURN_SECONDS: 600
  egress:
    credentialPrivateAllowlist: "fake-git:3000,localstack:4566"
worker:
  workspace:
    gcMinAgeSec: 0
scheduler:
  extraEnv:
    EXECUTION_WORKSPACE_STOPPED_TTL_SEC: "0"
