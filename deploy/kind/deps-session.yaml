# What a session needs beyond deps.yaml, for smoke.sh (KIND_MODEL fake or
# real): repositories served through the local GitHub App's token flow.
# Workers reach it only through the egress proxy's repository route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-git
  labels: {app: fake-git}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fake-git}
  template:
    metadata:
      labels: {app: fake-git}
    spec:
      terminationGracePeriodSeconds: 2
      # A Service named fake-git injects FAKE_GIT_PORT=tcp://<ip>:3000, which
      # is the server's own port setting.
      enableServiceLinks: false
      containers:
        - name: fake-git
          # up.sh replaces this with the chart's images.controlHost, which has git.
          image: CONTROL_HOST_IMAGE
          imagePullPolicy: IfNotPresent
          # args, not command: the image's init stays PID 1.
          args: ["bun", "run", "packages/testkit/src/local-github-main.ts", "sample-app", "gate-app"]
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /healthz, port: 3000}
            periodSeconds: 5
          # The fake App's signing key, generated on start; up.sh stores the
          # same key on the repositories (seed-credentials-main.ts, run here).
          volumeMounts:
            - {name: fake-github-key, mountPath: /var/lib/fake-github}
      volumes:
        - name: fake-github-key
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-git
spec:
  selector: {app: fake-git}
  ports:
    - port: 3000
