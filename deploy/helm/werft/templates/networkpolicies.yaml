{{- if .Values.networkPolicy.enabled }}
{{- $installation := include "ap.installationId" . -}}
# Worker Pods, by the labels the kubernetes execution backend puts on them:
# nothing reaches them, and they reach the egress proxy alone. No DNS (a
# query is a way out too), no other worker, no database, no node or cloud
# metadata address. The backend writes the proxy Service's ClusterIP into
# each Pod's hosts file, so HTTP(S)_PROXY still names the proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-worker
  labels:
    {{- include "ap.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: werft
      app.kubernetes.io/component: worker
      werft.installation: {{ $installation | quote }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 3128}
        - {protocol: TCP, port: 3129}
    {{- if .Values.networkPolicy.worker.allowDirectGateway }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 3200}
    {{- end }}
---
# The proxy takes connections from workers only. Its allowlists and the
# authorizer's grants decide what is reached through it; its own egress is
# every TCP port but the database's and the metrics listeners', and DNS. A
# model endpoint registered as on the internal network is dialled from here,
# and neither of those is one it may be (networkPolicy.egressProxy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.proxyHost" . }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "egress-proxy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 6 }}
  policyTypes: [Ingress{{ if .Values.networkPolicy.egressProxy.restrict }}, Egress{{ end }}]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: werft
              app.kubernetes.io/component: worker
              werft.installation: {{ $installation | quote }}
        {{- if .Values.conversationRuntime.enabled }}
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" . "component" "conversation-runtime") | nindent 14 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 3128}
        - {protocol: TCP, port: 3129}
  {{- if .Values.networkPolicy.egressProxy.restrict }}
  egress:
    # DNS is held off exceptCidrs as every other port is.
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
      {{- with include "ap.proxyEgressPeers" . }}
      {{- . | nindent 6 }}
      {{- end }}
    - ports:
        {{- include "ap.proxyEgressPorts" . | nindent 8 }}
      {{- with include "ap.proxyEgressPeers" . }}
      {{- . | nindent 6 }}
      {{- end }}
  {{- end }}
---
# 3000 is public (through the Ingress) and has no /internal route; 3100, the
# authorizer that hands out catalog credentials, and 3200, /internal, answer
# the egress proxy alone (and workers, with allowDirectGateway). With
# api.metrics on, its port admits networkPolicy.api.metrics.ingressFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.apiHost" . }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 3000}
      {{- with .Values.networkPolicy.api.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Workers' gateway calls arrive through the proxy.
    - from:
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 14 }}
        {{- if .Values.networkPolicy.worker.allowDirectGateway }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: werft
              app.kubernetes.io/component: worker
              werft.installation: {{ $installation | quote }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 3200}
    - from:
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 3100}
        - {protocol: TCP, port: {{ .Values.config.tracing.ingestPort }}}
    {{- if .Values.api.metrics.enabled }}
    # /metrics, for the collector.
    - ports:
        - {protocol: TCP, port: {{ .Values.api.metrics.port }}}
      {{- with .Values.networkPolicy.api.metrics.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
---
# The rest serve nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-no-ingress
  labels:
    {{- include "ap.labels" (dict "root" . "component" "control") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [scheduler, reconciler, slack, migrate, checkpoint-gc, session-archive]
  policyTypes: [Ingress]
  ingress: []
{{- if .Values.conversationRuntime.enabled }}
---
# The conversation runtime is held as a worker Pod is: nothing reaches it, and
# it reaches the egress proxy alone, with no DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-conversation-runtime
  labels:
    {{- include "ap.labels" (dict "root" . "component" "conversation-runtime") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "root" . "component" "conversation-runtime") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 3128}
        - {protocol: TCP, port: 3129}
{{- end }}
{{- if .Values.slack.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-slack-egress
  labels:
    {{- include "ap.labels" (dict "root" . "component" "slack") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "root" . "component" "slack") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The Slack Web API.
    - ports:
        - {protocol: TCP, port: 443}
    - ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.slack.databasePort }}}
{{- end }}
{{- end }}
