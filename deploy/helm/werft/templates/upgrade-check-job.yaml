{{- /* Outside the condition: api and slack read the same variables. */}}
{{- include "ap.workerEnvReserved" . }}
{{- if .Values.scheduler.enabled }}
# Runs before the migrate Job of an upgrade, on the target release's api image,
# and fails the upgrade while a session would be left with no worker image to
# resume on, or its running worker would end, and is not in
# upgrade.approvedSessions. Not a pre-install hook:
# nothing is deployed yet. `helm rollback` runs no hook; run the same command
# by hand first (the Kubernetes install page of the docs site (operate/kubernetes-deployment)).
{{- $scheduler := printf "%s-scheduler" (include "ap.fullname" .) }}
{{- $images := list "WORKER_IMAGES" "WORKER_IMAGE" "WORKER_IMAGE_RUNTIME" "WORKER_IMAGE_PREVIOUS" "WORKER_IMAGE_PREVIOUS_RUNTIME" }}
{{- $deployed := dict }}
{{- /* Kept out of $deployed, whose size says "unpinned". */}}
{{- $gateway := "" }}
{{- $state := "" }}
{{- /* All empty under `helm template` and a client --dry-run, where lookup reads nothing: the check then fails rather than guess. */}}
{{- $found := lookup "apps/v1" "Deployment" .Release.Namespace $scheduler }}
{{- if $found }}
{{- range $found.spec.template.spec.containers }}
{{- if eq .name "scheduler" }}
{{- range .env }}
{{- if has .name $images }}
{{- $_ := set $deployed .name (.value | default "") }}
{{- end }}
{{- if eq .name "WORKER_GATEWAY_URL" }}
{{- $gateway = .value | default "" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (index $deployed "WORKER_IMAGE") (eq (len $deployed) 1) }}
{{- $state = "unpinned" }}
{{- end }}
{{- /* An empty Deployment lookup alone cannot say "none": `default` exists in every namespace, so reading it proves the cluster answered. Read only here, so an ordinary upgrade needs no more RBAC. */}}
{{- else if lookup "v1" "ServiceAccount" .Release.Namespace "default" }}
{{- $state = "absent" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ap.fullname" . }}-upgrade-check
  labels:
    {{- include "ap.labels" (dict "root" . "component" "upgrade-check") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    # After the ExternalSecret (-10) that writes DATABASE_URL, before migrate (0).
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # The verdict is the same on a retry.
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.upgrade.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ap.labels" (dict "root" . "component" "upgrade-check") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "ap.podSecurityContext" . | nindent 8 }}
      {{- include "ap.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: upgrade-check
          image: {{ include "ap.image" (dict "root" . "name" "controlHost") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["bun", "run", "apps/control-host/src/api/upgrade-check.ts"]
          env:
            {{- include "ap.secretEnv" (dict "root" . "key" "DATABASE_URL") | nindent 12 }}
            {{- range $images }}
            - name: UPGRADE_DEPLOYED_{{ . }}
              value: {{ index $deployed . | default "" | quote }}
            {{- end }}
            - name: UPGRADE_DEPLOYED_STATE
              value: {{ $state | quote }}
            # A worker keeps the address it was created with: when the two
            # differ, the check lists every worker holding a slot.
            - name: UPGRADE_DEPLOYED_WORKER_GATEWAY_URL
              value: {{ $gateway | quote }}
            - name: WORKER_GATEWAY_URL
              value: {{ get .Values.scheduler.extraEnv "WORKER_GATEWAY_URL" | default (include "ap.workerGatewayUrl" .) | quote }}
            {{- with include "ap.workerImageEnv" . | trim }}{{ . | nindent 12 }}{{ end }}
            {{- with include "ap.workerRuntimeEnv" . | trim }}{{ . | nindent 12 }}{{ end }}
            - name: UPGRADE_APPROVED_SESSIONS
              value: {{ toJson .Values.upgrade.approvedSessions | quote }}
          resources:
            {{- toYaml .Values.upgrade.resources | nindent 12 }}
          securityContext:
            {{- include "ap.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "ap.tmpMount" . | nindent 12 }}
      volumes:
        {{- include "ap.tmpVolume" . | nindent 8 }}
{{- end }}
