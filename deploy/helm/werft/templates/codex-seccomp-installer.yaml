{{- /* Outside the if, so a stray localhostProfile is refused in any install. */}}
{{- $profile := include "ap.codexSeccompProfile" . }}
{{- if and .Values.codexSandbox.enabled (eq .Values.codexSandbox.provider "installer") }}
{{- $installer := .Values.codexSandbox.installer }}
{{- $source := .Files.Get "files/codex-sandbox-seccomp.json" }}
{{- $target := printf "/host/%s" (base $profile) }}
{{- $name := printf "%s-codex-seccomp" (include "ap.fullname" .) }}
{{- /* Cluster-scoped, so named for the namespace too: two releases of one name must not share them. */}}
{{- $clusterName := printf "%s-%s" .Release.Namespace $name }}
{{- $serviceAccount := printf "system:serviceaccount:%s:%s" .Release.Namespace $name }}
{{- /* The scheduler's CODEX_SECCOMP_NODE_LABEL: Codex Pods given the profile require it. */}}
{{- $labelKey := "werft.codex-seccomp-profile" }}
{{- $labelValue := "installed" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ap.fullname" . }}-codex-seccomp
  labels:
    {{- include "ap.labels" (dict "root" . "component" "codex-seccomp-installer") | nindent 4 }}
data:
  codex-sandbox.json: {{ $source | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "codex-seccomp-installer") | nindent 4 }}
# The label container alone gets a token, through its own projected volume.
automountServiceAccountToken: false
---
# Labels the node the installer runs on. RBAC cannot name "its own node", so
# this reaches every Node; the admission policy below holds each request to
# the node the caller's Pod is bound to, and to this one label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "codex-seccomp-installer") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "codex-seccomp-installer") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# A Node change by the installer's ServiceAccount passes only when it is to
# the node its Pod is bound to (the token's node-name, Kubernetes 1.30+) and
# sets this label to this value with nothing else of the Node changed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "codex-seccomp-installer") | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [nodes]
  matchConditions:
    - name: installer
      expression: {{ printf "request.userInfo.username == '%s'" $serviceAccount | quote }}
  variables:
    - name: labels
      expression: object.metadata.?labels.orValue({})
    - name: oldLabels
      expression: oldObject.metadata.?labels.orValue({})
  validations:
    - expression: >-
        request.userInfo.extra[?'authentication.kubernetes.io/node-name'].orValue([])
        == [object.metadata.name]
      message: the codex-seccomp installer labels only the node its Pod runs on
    - expression: >-
        variables.labels[?'{{ $labelKey }}'] == optional.of('{{ $labelValue }}')
        && variables.labels.all(k, k == '{{ $labelKey }}'
        || (k in variables.oldLabels && variables.oldLabels[k] == variables.labels[k]))
        && variables.oldLabels.all(k, k in variables.labels)
      message: the codex-seccomp installer only sets {{ $labelKey }}={{ $labelValue }}
    - expression: >-
        object.spec == oldObject.spec
        && object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({})
        && object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([])
        && object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([])
        && object.metadata.?generateName == oldObject.metadata.?generateName
        && object.metadata.?generation == oldObject.metadata.?generation
      message: the codex-seccomp installer changes nothing on a Node but its label
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "codex-seccomp-installer") | nindent 4 }}
spec:
  policyName: {{ $clusterName }}
  validationActions: [Deny]
---
# Writes the Codex sandbox's seccomp profile to one directory under the
# kubelet's seccomp root on each worker node, then labels the node and
# sleeps; ready once the file there is this release's. The label is never
# taken off: the file stays when the Pod goes, so the node still holds it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "codex-seccomp-installer") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "root" . "component" "codex-seccomp-installer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ap.labels" (dict "root" . "component" "codex-seccomp-installer") | nindent 8 }}
      annotations:
        checksum/profile: {{ sha256sum $source }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "ap.imagePullSecrets" . | nindent 6 }}
      initContainers:
        # Root, because the directory the kubelet creates is root's; with no
        # capabilities and no token it can write there and nowhere else it
        # is not given.
        - name: install
          {{- if or $installer.image.repository $installer.image.digest }}
          image: {{ include "ap.imageRef" (dict "root" . "label" "codexSandbox.installer.image" "image" $installer.image) }}
          {{- else }}
          image: {{ include "ap.image" (dict "root" . "name" "controlHost") }}
          {{- end }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              cp /profile/codex-sandbox.json /host/.codex-sandbox.json.tmp
              mv -f /host/.codex-sandbox.json.tmp {{ $target }}
          resources:
            {{- toYaml $installer.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: host
              mountPath: /host
      containers:
        # Not root, and the node's directory read-only: it only labels the
        # node the profile is now on, then waits.
        - name: label
          image: {{ include "ap.image" (dict "root" . "name" "controlHost") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_LABEL_KEY
              value: {{ $labelKey | quote }}
            - name: NODE_LABEL_VALUE
              value: {{ $labelValue | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              bun -e '
                const dir = "/var/run/werft/kube-api";
                const { NODE_NAME: node, NODE_LABEL_KEY: key, NODE_LABEL_VALUE: value } = process.env;
                let host = process.env.KUBERNETES_SERVICE_HOST;
                if (host.includes(":")) host = `[${host}]`;
                const url = `https://${host}:${process.env.KUBERNETES_SERVICE_PORT}/api/v1/nodes/${encodeURIComponent(node)}`;
                const patch = async (label, query) =>
                  fetch(url + query, {
                    method: "PATCH",
                    headers: {
                      authorization: `Bearer ${(await Bun.file(`${dir}/token`).text()).trim()}`,
                      "content-type": "application/merge-patch+json",
                    },
                    body: JSON.stringify({ metadata: { labels: { [key]: label } } }),
                    tls: { ca: await Bun.file(`${dir}/ca.crt`).text() },
                  });
                // Helm creates the admission policy after this Pod, and the
                // API server loads it some time after that: until a change it
                // must refuse is refused, nothing is changed for real.
                for (let attempt = 1; ; attempt++) {
                  const probe = await patch(`${value}-probe`, "?dryRun=All");
                  const text = await probe.text();
                  if (probe.status === 422 && text.includes("codex-seccomp installer")) break;
                  if (!probe.ok || attempt === 60) {
                    console.error(`admission policy not enforced for node ${node}: ${probe.status} ${text.slice(0, 500)}`);
                    process.exit(1);
                  }
                  await Bun.sleep(2000);
                }
                const response = await patch(value, "");
                if (!response.ok) {
                  console.error(`labelling node ${node} ${key}=${value}: ${response.status} ${(await response.text()).slice(0, 500)}`);
                  process.exit(1);
                }
                console.log(`labelled node ${node} ${key}=${value}`);
              '
              trap 'exit 0' TERM INT
              while :; do sleep 3600 & wait $!; done
          readinessProbe:
            exec:
              command: [cmp, -s, /profile/codex-sandbox.json, {{ $target | quote }}]
            periodSeconds: 30
          resources:
            {{- toYaml $installer.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: host
              mountPath: /host
              readOnly: true
            - name: kube-api
              mountPath: /var/run/werft/kube-api
              readOnly: true
      volumes:
        - name: profile
          configMap:
            name: {{ $name }}
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: host
          hostPath:
            path: {{ printf "%s/seccomp/%s" (trimSuffix "/" $installer.kubeletDir) (dir $profile) | quote }}
            type: DirectoryOrCreate
      {{- with (default .Values.worker.nodeSelector $installer.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.worker.tolerations $installer.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
