# Defaults run on plain Kubernetes (kind included). Everything AWS-only
# (ALB Ingress, IRSA, ECR, External Secrets) is off here and shown in
# values-aws.example.yaml. Every default below is the compose value
# (infra/compose.core.yml); size them per installation.

# EXECUTION_INSTALLATION_ID. Also the value of the
# werft.installation label the worker NetworkPolicy selects on, so
# it must be a valid label value.
installationId: local

# Every image renders as <registry>/<repository>@<digest>. There is no tag
# field and no default digest: a missing or malformed digest fails the
# render, so nothing installs an image nobody pinned. images.yml records the
# digests of each build.
images:
  # Prefix for every repository below, e.g. an ECR registry host. Empty
  # uses the repositories as given.
  registry: ""
  pullPolicy: IfNotPresent
  # Secret names for pulling the images; handed to the worker Pods too
  # (EXECUTION_K8S_IMAGE_PULL_SECRETS).
  pullSecrets: []
  # api, scheduler, reconciler, slack, migrate and checkpoint GC.
  controlHost:
    repository: ghcr.io/jeongjaesoon/werft-control-host
    digest: ""
  egressProxy:
    repository: ghcr.io/jeongjaesoon/werft-egress-proxy
    digest: ""
  # Not deployed by the chart: the scheduler launches it per session
  # (WORKER_IMAGE). Read only while images.workers is empty, and a packaged
  # release lists its images there: a deployment of one image sets
  # images.workers: [] beside this, from the target release's
  # files/release-images.json.
  worker:
    repository: ghcr.io/jeongjaesoon/werft-worker
    digest: ""
    # The `runtime` images.yml recorded with this digest, as given, e.g.
    # {engine: claude, sdkVersion: 0.3.280, cliVersion: 2.1.280,
    # profileDigestScheme: 1}; the Codex worker image (apps/worker built with
    # WORKER_RUNTIME=codex_app_server, ghcr.io/jeongjaesoon/werft-worker-codex)
    # names {engine: codex, sdkVersion: 0.167.0, cliVersion: 0.167.0, ...}.
    # One worker image holds one engine, so a deployment sets repository,
    # digest and runtime for the engine it runs. An image that also resumes older checkpoints
    # adds restorableSchemes: [1, 2] (it must include profileDigestScheme). Empty launches every session on this image, and
    # an upgrade can then keep this image but not replace it
    # (the Kubernetes install page of the docs site (operate/kubernetes-deployment)).
    runtime: {}
  # The release before, so a session whose checkpoint the current image
  # cannot restore resumes on it (WORKER_IMAGE_PREVIOUS). Its digest and
  # runtime go together, and need images.worker.runtime set. A worker built
  # before the profile removal cannot read this control host's claim answer:
  # it is outside the support window, and sits here only while the upgrade
  # check demands the deployed image, with no session launching on it.
  workerPrevious:
    repository: ghcr.io/jeongjaesoon/werft-worker
    digest: ""
    runtime: {}
  # The worker images as one list (WORKER_IMAGES), each engine's newest first,
  # instead of images.worker and images.workerPrevious, whose digest and
  # runtime must then be empty. A packaged release sets it to its Claude and
  # Codex images, the entries of files/release-images.json. Helm replaces a
  # list as a whole, so a list in an installation's values stays as it is on
  # every upgrade, with no image of the new release. Each entry: {repository, digest, runtime,
  # releasedAt, retracted?}, runtime as images.yml recorded it and releasedAt
  # an RFC 3339 time with seconds (at most milliseconds), strictly decreasing
  # down the list among one engine's entries. Each session launches on an
  # image of its own engine, so a list of a Claude and a Codex image runs
  # both kinds of agent. retracted: true keeps an image listed but launches
  # nothing on it; its sessions move to an unretracted image of the same
  # engine, SDK and CLI, or stop as runtime_retired. At most two unretracted
  # images per engine. files/next-workers.jq builds the next list from a
  # packaged release's images and the deployed values (the Kubernetes upgrade
  # page of the docs site).
  workers: []

# The chart never holds a secret value. Each workload reads only the keys it
# needs from this one Secret:
#   DATABASE_URL            api, scheduler, reconciler, slack, migrate,
#                           checkpoint GC, metrics (read only)
#   EGRESS_AUTHORIZER_TOKEN api, egress-proxy (the same value on both sides)
#   AWS_ACCESS_KEY_ID,
#   AWS_SECRET_ACCESS_KEY   api, checkpoint GC (the checkpoint object store),
#                           only while objectStoreKeys is true
#   CONVERSATION_RUNTIME_TOKEN
#                           api and the conversation runtime, only while
#                           conversationRuntime.enabled: the bearer that opens
#                           the runtime's two routes on the api and nothing
#                           else (`openssl rand -hex 32`). To rotate it, put
#                           the old value in
#                           CONVERSATION_RUNTIME_TOKEN_PREVIOUS (api only,
#                           optional) and the new one here, restart both, then
#                           remove the old one.
#   PLATFORM_SECRET_KEY     api and slack, required: the master key stored
#                           credentials are encrypted under
#                           (`openssl rand -hex 32`)
secrets:
  name: werft
  # Hand the two AWS keys above to the api and the checkpoint GC. false
  # leaves them out, and the object store signs with the AWS default
  # credential chain instead: IRSA through serviceAccounts.api on EKS.
  objectStoreKeys: true
  # Have the External Secrets Operator write the Secret above from a secret
  # store instead of creating it by hand. Needs the operator's CRDs.
  externalSecret:
    enabled: false
    secretStoreRef:
      kind: ClusterSecretStore
      name: ""
    # The store entry holding every key above as JSON properties.
    remoteKey: ""
    refreshInterval: 1h

serviceAccounts:
  # The only ServiceAccount meant to carry cloud credentials (IRSA on EKS).
  # With secrets.objectStoreKeys false the role signs the api's object store
  # requests; with it true the static keys win over the role. The checkpoint GC runs as this one too: it releases object
  # holds with the api's object store settings.
  api:
    annotations: {}
  scheduler:
    annotations: {}

config:
  logLevel: info
  # api-key, not none: workers reach the api through the proxy, and in
  # `none` mode /v1 takes any X-Owner-Id as the caller.
  authMode: api-key
  heartbeatTtlSec: 30
  # Trace export is configured with the OTEL_* and TRACE_* keys in
  # api.extraEnv. Only the port is here, because the Service and the
  # NetworkPolicy need it too: set TRACE_INGEST_PORT nowhere else.
  tracing:
    ingestPort: 4319
  # Read by the api and the scheduler with one parser. The session limits
  # (QUEUED_INPUT_LIMIT_PER_SESSION, STORAGE_LIMIT_BYTES,
  # SESSION_COST_LIMIT_USD, SESSION_TOKEN_LIMIT), the turn time
  # (MAX_TURN_SECONDS) and the provider retries (PROVIDER_MAX_RETRIES) are
  # the owner's, in Settings > Workspace > Execution limits: one still set
  # here goes to the migrate Job only, which carries it in while that limit
  # has nothing saved.
  limits:
    EXECUTION_SLOT_LIMIT: 10
  aws:
    region: ap-northeast-1
    # An S3-compatible endpoint (LocalStack, MinIO); empty is AWS.
    endpointUrl: ""
  # The api, its checkpoint-gc and session-archive jobs and the scheduler read
  # these alike. The chart refuses AWS_* and CHECKPOINT_OBJECT_* in any
  # extraEnv or config.limits: there they would reach one role and split the
  # object store.
  checkpoints:
    bucket: claude-sessions
    # s3 | disabled: run with no object store, every checkpoint refused.
    objectStore: s3
    # locked | unversioned (see infra/compose.core.yml).
    protection: locked
    # enforce | warn: start on a bucket whose default encryption is not SSE-S3.
    encryptionCheck: enforce
    # Sized with api.resources.limits.memory (2 x 2 x this + 512 MiB).
    gitMemoryMb: 1536
  egress:
    # Public hosts a worker may reach through the forward proxy. None: its one
    # public destination is its provider, through the credential route.
    allowlist: ""
    # Private hosts reachable through the forward proxy. Empty is the api
    # Service's gateway port alone.
    privateAllowlist: ""
    # Upstreams only the credential routes reach: provider, repository,
    # object store, and the packages route's public registries.
    credentialAllowlist: "api.anthropic.com:443,api.openai.com:443,registry.npmjs.org:443,rubygems.org:443,proxy.golang.org:443,sum.golang.org:443"
    credentialPrivateAllowlist: ""
    # Public hosts the packages route follows a registry's redirect to.
    packagesRedirectAllowlist: ""

api:
  replicas: 2
  # workspaceEnforce is set in the console now (the setting above); a value
  # set here goes to the migrate Job only, the same way.
  # Above SHUTDOWN_DRAIN_MS + SHUTDOWN_CLOSE_MS (35s + 5s).
  terminationGracePeriodSeconds: 45
  # 2 bundle verifications x (git fetch + index-pack) x gitMemoryMb + 512 MiB.
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 7168Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Plain environment variables for the api, name: value. CONSOLE_ORIGIN is
  # the console's public origin; Slack's redirect and events addresses are
  # computed from it. Unset, Slack accounts cannot be linked and an install
  # leaves the app without an event subscription (events_url_unset).
  # When this Ingress is in-house and Slack's events enter on a separate
  # internet-facing entrance routing just /v1/slack/events and
  # /v1/slack/interactions, an owner saves that entrance's https base in
  # Settings > Integrations > Slack; it is not an environment variable.
  #   extraEnv:
  #     CONSOLE_ORIGIN: https://werft.example.com
  extraEnv: {}

# One replica, replaced with Recreate: a second scheduler never gets the
# pass lock, so its health goes stale and liveness restarts it in a loop.
scheduler:
  enabled: true
  terminationGracePeriodSeconds: 45
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  intervalSec: 5
  maxConsecutiveFailures: 3
  # Above intervalSec + passTimeoutSec.
  healthStaleSec: 200
  passTimeoutSec: 180
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}
  # At startup, warns in the scheduler log for each node worker Pods may land
  # on (worker.nodeSelector, worker.tolerations) whose allocatable memory holds
  # fewer than two workers of worker.memoryMb. true also creates a ClusterRole
  # that reads Nodes, bound to the scheduler, which a namespace-only installer
  # cannot create; false creates none. A failed read is logged and skipped.
  nodeCapacityCheck:
    enabled: false

# Passes are re-judged under row locks, so no leader election is needed;
# one replica is enough.
reconciler:
  replicas: 1
  terminationGracePeriodSeconds: 20
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  intervalSec: 10
  passTimeoutSec: 60
  maxConsecutiveFailures: 3
  healthStaleSec: 90
  batchSize: 100
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

# Drains the Slack inbox, claiming rows for leaseSec at a time; one replica
# is enough. It loads the api's catalog.
slack:
  enabled: true
  replicas: 1
  # Above the role's 10s stop grace.
  terminationGracePeriodSeconds: 20
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  intervalSec: 2
  passTimeoutSec: 60
  maxConsecutiveFailures: 3
  # Above intervalSec + passTimeoutSec.
  healthStaleSec: 90
  batchSize: 10
  leaseSec: 60
  # How long a Slack row waits for its web input's post before it closes.
  inputHoldSec: 3600
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

egressProxy:
  replicas: 2
  # 512 MiB credential bodies + 64 MiB response queues + 2048 MiB forward
  # queues + 256 MiB Bun = 2880 MiB, under this.
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 3072Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

# The conversation runtime: one Pod of the worker image (the newest Claude
# one) on its conversation entry point, for every agent's conversation turns.
# Off: nothing sends it a person's message yet, and an operator's
# `conversation-turn` command in the api Pod is the one way a turn starts.
# It is held as a worker Pod is (egress proxy only, no DNS, no provider key),
# on the worker Pods' nodes (worker.nodeSelector, worker.tolerations), and
# needs CONVERSATION_RUNTIME_TOKEN in the Secret. Its turns are queued in one
# api process's memory, so with api.replicas above 1 an operator's turn is
# refused from the api Pods the runtime is not asking.
conversationRuntime:
  enabled: false
  # Above the few seconds it takes to cut a running turn and report it.
  terminationGracePeriodSeconds: 30
  # Up to 8 topic sessions (CONVERSATION_TOPIC_SESSION_LIMIT), each an engine
  # process kept between turns: one idle after a turn measured about 215Mi
  # RSS. 8 x 215Mi, the loop, the topics' in-memory directory (256Mi) and a
  # margin. Requested in full, so the Pod is never squeezed below it.
  resources:
    requests: {cpu: 100m, memory: 2560Mi}
    limits: {memory: 2560Mi}

# A pre-install/pre-upgrade hook: the schema is migrated before any new pod
# of the release starts.
migrate:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# The platform metrics (apps/docs/content/docs/run-server/self-hosting/operate/metrics.mdx): GET /metrics on port 9464
# in the Prometheus text format, computed from the database at each scrape.
# Off by default. One replica, replaced with Recreate: every replica would
# report the same installation-wide totals, so a second one is a duplicate
# scrape target. It gets the scheduler's config.limits, so its launch queue
# is the one the scheduler drains.
metrics:
  enabled: false
  port: 9464
  # How the collector finds the Pod: Prometheus annotations, or a Datadog
  # Agent openmetrics check under ad.datadoghq.com/metrics.checks
  # (apps/docs/content/docs/run-server/self-hosting/operate/metrics.mdx). For example:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port: "9464"
  podAnnotations: {}
  terminationGracePeriodSeconds: 20
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

# The pre-upgrade check (templates/upgrade-check-job.yaml): an upgrade that
# changes the worker image, or drops or replaces the previous image deployed
# now, stops unless every session it would leave with no image to resume on
# is listed here, exactly the list the check prints.
upgrade:
  approvedSessions: []
  activeDeadlineSeconds: 300
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# Must not run while a backup is being taken.
checkpointGc:
  enabled: true
  schedule: "0 4 * * 0"
  dryRun: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []

# Moves events of long-idle sessions into held objects under session-archive/.
# How long idle, and whether it only counts, are the owner's in Settings >
# Workspace > Execution limits: an afterDays or dryRun set here is carried
# there once by the migrate Job, while nothing is saved, and read by nothing
# after. Runs only with CHECKPOINT_OBJECT_PROTECTION=locked. Must not run
# while a backup is being taken.
sessionArchive:
  enabled: true
  schedule: "0 5 * * 0"
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []

# Settings the scheduler hands the worker Pods it launches.
worker:
  # StorageClass of workspace PVCs; empty is the cluster default.
  storageClass: ""
  # A dedicated node group, e.g. with podPidsLimit set on its kubelet.
  nodeSelector: {}
  tolerations: []
  cpus: 1
  # Requests equal limits on worker pods; sized so a resumed engine holding
  # a transcript at the 512 MiB checkpoint limit stays under half of it.
  # Sessions running at once on a node is about its allocatable memory, less
  # what other Pods there request, over this: a 16 GiB node that also runs the
  # rest of the chart holds 2. values-small-node.example.yaml trades the
  # large-transcript headroom for more sessions on a small node.
  # How to count and trade them off: the capacity page of the docs site
  # (apps/docs/content/docs/run-server/self-hosting/capacity.mdx).
  memoryMb: 4608
  # Node disk a worker may use outside its PVC (mostly its log), request
  # and limit both; past it the kubelet evicts the Pod.
  ephemeralStorageMb: 1024
  workspace:
    quotaMb: 4096
    gcMinAgeSec: 3600
    # Declares that storage hard-enforces the requested bytes for every workspace
    # PVC in this installation, including existing PVCs. With an empty storageClass,
    # the cluster default applies: verify enforcement for each PVC. Werft does not
    # verify it. The declaration path leaves inode enforcement unknown.
    enforcedByStorage: false
  # A DaemonSet that pulls the worker images onto each worker node ahead of
  # the first session there, and again when an upgrade changes them: the
  # unretracted images.workers entries, or images.worker and
  # images.workerPrevious. Each image is a container that only runs `true`;
  # the Pod then sleeps on images.controlHost. Off by default.
  prePull:
    enabled: false
    # Each container's.
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}
    # Empty: worker.nodeSelector and worker.tolerations.
    nodeSelector: {}
    tolerations: []

# Codex auto mode runs each command in Codex's bubblewrap sandbox: the
# workspace writable, the rest read-only, the network still behind the egress
# proxy. bubblewrap needs a few namespace calls RuntimeDefault blocks, so a
# worker Pod of an image whose runtime says engine codex (images.worker.runtime
# or images.workers) gets the Localhost seccomp profile
# <kubeletDir>/seccomp/werft/codex-sandbox.json instead; no other Pod does.
# The path is fixed, not a setting. A Codex image with no runtime keeps
# RuntimeDefault and its auto sessions are refused. Such a Pod also requires
# the node label werft.codex-seccomp-profile=installed (required node
# affinity), so it waits Pending until a node holding the profile has room.
# The installer below writes the profile and sets that label; with it off,
# the operator does both. A labelled node that has lost the file still fails
# the Pod with CreateContainerError, which the scheduler counts as a failed
# launch naming the profile and the installer. Nodes must allow unprivileged
# user namespaces (Ubuntu's kernel.apparmor_restrict_unprivileged_userns=1
# does not): where the sandbox cannot start, auto sessions are refused.
# Auto mode never runs outside the sandbox.
codexSandbox:
  # false: auto mode off. No profile and no installer, CODEX_SANDBOX=disabled
  # on the workers, and every auto session is refused, naming this value;
  # the other permission modes run under RuntimeDefault.
  enabled: true
  # A DaemonSet that writes the profile (files/codex-sandbox-seccomp.json) to
  # <kubeletDir>/seccomp/werft on each worker node, labels that node
  # werft.codex-seccomp-profile=installed, then sleeps. The writing init
  # container runs as root, because the directory is root's, with no
  # capabilities, no token and a read-only root; a namespace held to the
  # restricted Pod Security level refuses it. The labelling container runs
  # as uid 1000 (images.controlHost, for bun) with the directory read-only
  # and a token whose ClusterRole can patch Nodes; a ValidatingAdmissionPolicy
  # (Kubernetes 1.30+) holds it to its own node and that one label. The label
  # stays when the installer goes, as the file does. Turn it off where the
  # profile is put on the nodes another way (the Security Profiles Operator,
  # a node image), and label those nodes yourself.
  installer:
    enabled: true
    kubeletDir: /var/lib/kubelet
    # The image the writing init container runs: empty repository and digest
    # is images.controlHost, which has the shell, cp and mv it needs. Any
    # image with those works, pinned by digest.
    image:
      repository: ""
      digest: ""
    # Each of the two containers'.
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 96Mi}
    # Empty: worker.nodeSelector and worker.tolerations, the nodes worker
    # Pods land on.
    nodeSelector: {}
    tolerations: []

# A throwaway preview install, never a real one. true gives the api
# PREVIEW_NAMESPACE (its own namespace), and the demo-accounts and demo-data
# CLIs then run in the api Pod, but only while DATABASE_URL is that
# namespace's `postgres` Service: the demo accounts' password is public.
# render-check.ts fails the AWS example if it turns this on.
preview:
  enabled: false

service:
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: agent-platform.example.com
  tls: []
  console:
    # Routes "/" (the web console the api serves) and answers /internal with
    # an ALB fixed-response 404 ahead of it; needs className alb. Read
    # the Kubernetes install page of the docs site (operate/kubernetes-deployment) before turning it on.
    enabled: false

networkPolicy:
  enabled: true
  api:
    # Peers allowed to reach the public port 3000 besides the egress proxy
    # (NetworkPolicy `from` entries). Empty allows any source: the Ingress
    # controller or load balancer reaches pods from outside the namespace.
    ingressFrom: []
  worker:
    # Workers reach the gateway through the egress proxy, whose NO_PROXY
    # names only localhost and the proxy, so they need no direct route.
    allowDirectGateway: false
  slack:
    # The PostgreSQL port slack's egress may reach, on any address.
    databasePort: 5432
  metrics:
    # Peers allowed to scrape the metrics port (NetworkPolicy `from`
    # entries), e.g. the collector's namespace. Empty allows any source, as
    # api.ingressFrom does: collectors often run outside the namespace. The
    # metrics carry counts and tool and model names, no ids or secrets.
    ingressFrom: []
