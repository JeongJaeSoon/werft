# Defaults run on plain Kubernetes (kind included). Everything AWS-only
# (ALB Ingress, IRSA, ECR, External Secrets) is off here and shown in
# values-aws.example.yaml. Every default below is the compose value
# (infra/compose.core.yml); size them per installation.

# EXECUTION_INSTALLATION_ID. Also the value of the
# werft.installation label the worker NetworkPolicy selects on, so
# it must be a valid label value.
installationId: local

# Every image renders as <registry>/<repository>@<digest>. There is no tag
# field and no default digest: a missing or malformed digest fails the
# render, so nothing installs an image nobody pinned. images.yml records the
# digests of each build.
images:
  # Prefix for every repository below, e.g. an ECR registry host. Empty
  # uses the repositories as given.
  registry: ""
  pullPolicy: IfNotPresent
  # Secret names for pulling the images; handed to the worker Pods too
  # (EXECUTION_K8S_IMAGE_PULL_SECRETS).
  pullSecrets: []
  # api, scheduler, reconciler, slack, migrate and checkpoint GC.
  controlHost:
    repository: ghcr.io/jeongjaesoon/werft-control-host
    digest: ""
  egressProxy:
    repository: ghcr.io/jeongjaesoon/werft-egress-proxy
    digest: ""
  # Not deployed by the chart: the scheduler launches it per session
  # (WORKER_IMAGE).
  worker:
    repository: ghcr.io/jeongjaesoon/werft-worker
    digest: ""
    # The `runtime` images.yml recorded with this digest, as given, e.g.
    # {engine: claude, sdkVersion: 0.3.280, cliVersion: 2.1.280,
    # profileDigestScheme: 1}; the Codex worker image (apps/worker built with
    # WORKER_RUNTIME=codex_app_server, a repository of its own) names
    # {engine: codex, sdkVersion: 0.167.0, cliVersion: 0.167.0, ...}. One
    # worker image holds one engine, so a deployment sets repository, digest
    # and runtime for the engine it runs. An image that also resumes older checkpoints
    # adds restorableSchemes: [1, 2] (it must include profileDigestScheme). Empty launches every session on this image, and
    # an upgrade can then keep this image but not replace it
    # (the Kubernetes install page of the docs site (operate/kubernetes-deployment)).
    runtime: {}
  # The Codex worker image of the same release (apps/worker built with
  # WORKER_RUNTIME=codex_app_server). The chart does not deploy it and reads
  # nothing from this entry: a deployment that runs Codex copies this
  # repository, digest and runtime into images.worker. A packaged release
  # fills the digest and runtime.
  workerCodex:
    repository: ghcr.io/jeongjaesoon/werft-worker-codex
    digest: ""
    runtime: {}
  # The release before, so a session whose checkpoint the current image
  # cannot restore resumes on it (WORKER_IMAGE_PREVIOUS). Its digest and
  # runtime go together, and need images.worker.runtime set. A worker built
  # before the profile removal cannot read this control host's claim answer:
  # it is outside the support window, and sits here only while the upgrade
  # check demands the deployed image, with no session launching on it.
  workerPrevious:
    repository: ghcr.io/jeongjaesoon/werft-worker
    digest: ""
    runtime: {}

# The chart never holds a secret value. Each workload reads only the keys it
# needs from this one Secret:
#   DATABASE_URL            api, scheduler, reconciler, slack, migrate,
#                           checkpoint GC, metrics (read only)
#   EGRESS_AUTHORIZER_TOKEN api, egress-proxy (the same value on both sides)
#   AWS_ACCESS_KEY_ID,
#   AWS_SECRET_ACCESS_KEY   api, checkpoint GC (the checkpoint object store),
#                           only while objectStoreKeys is true
#   PLATFORM_SECRET_KEY     api and slack, required: the master key stored
#                           credentials are encrypted under
#                           (`openssl rand -hex 32`)
secrets:
  name: werft
  # Hand the two AWS keys above to the api and the checkpoint GC. false
  # leaves them out, and the object store signs with the AWS default
  # credential chain instead: IRSA through serviceAccounts.api on EKS.
  objectStoreKeys: true
  # Further keys handed to the api alone, as environment variables of the
  # same name: the credentials the settings name by value_env. slack reads
  # the settings too, but never their credentials.
  catalogEnv: [ANTHROPIC_API_KEY]
  # Have the External Secrets Operator write the Secret above from a secret
  # store instead of creating it by hand. Needs the operator's CRDs.
  externalSecret:
    enabled: false
    secretStoreRef:
      kind: ClusterSecretStore
      name: ""
    # The store entry holding every key above as JSON properties.
    remoteKey: ""
    refreshInterval: 1h

serviceAccounts:
  # The only ServiceAccount meant to carry cloud credentials (IRSA on EKS).
  # With secrets.objectStoreKeys false the role signs the api's object store
  # and Secrets Manager requests; with it true the static keys win over the
  # role in both. The checkpoint GC runs as this one too: it releases object
  # holds with the api's object store settings.
  api:
    annotations: {}
  scheduler:
    annotations: {}

config:
  logLevel: info
  # api-key, not none: workers reach the api through the proxy, and in
  # `none` mode /v1 takes any X-Owner-Id as the caller.
  authMode: api-key
  heartbeatTtlSec: 30
  # Trace export is configured with the OTEL_* and TRACE_* keys in api.extraEnv
  # (docs/operator/api-server.md). Only the port is here, because the Service
  # and the NetworkPolicy need it too: set TRACE_INGEST_PORT nowhere else.
  tracing:
    ingestPort: 4319
  # Read by the api and the scheduler with one parser.
  limits:
    EXECUTION_SLOT_LIMIT: 10
    QUEUED_INPUT_LIMIT_PER_SESSION: 20
    STORAGE_LIMIT_BYTES: 1073741824
    MAX_TURN_SECONDS: 3600
    SESSION_COST_LIMIT_USD: 25
    SESSION_TOKEN_LIMIT: 0
    PROVIDER_MAX_RETRIES: 2
  aws:
    region: ap-northeast-1
    # An S3-compatible endpoint (LocalStack, MinIO); empty is AWS.
    endpointUrl: ""
    # The Secrets Manager the catalog's secret_id references read; empty is AWS.
    secretsManagerEndpointUrl: ""
  checkpoints:
    bucket: claude-sessions
    # locked | unversioned (see infra/compose.core.yml).
    protection: locked
    # Sized with api.resources.limits.memory (2 x 2 x this + 512 MiB).
    gitMemoryMb: 1536
  egress:
    # Public hosts a worker may reach through the forward proxy. None: its one
    # public destination is its provider, through the credential route.
    allowlist: ""
    # Private hosts reachable through the forward proxy. Empty is the api
    # Service's gateway port alone.
    privateAllowlist: ""
    # Upstreams only the credential routes reach: provider, repository,
    # object store, and the packages route's public registries.
    credentialAllowlist: "api.anthropic.com:443,api.openai.com:443,registry.npmjs.org:443,rubygems.org:443,proxy.golang.org:443,sum.golang.org:443"
    credentialPrivateAllowlist: ""
    # Public hosts the packages route follows a registry's redirect to.
    packagesRedirectAllowlist: ""

api:
  replicas: 2
  workspaceEnforce: warn
  # Above SHUTDOWN_DRAIN_MS + SHUTDOWN_CLOSE_MS (35s + 5s).
  terminationGracePeriodSeconds: 45
  # 2 bundle verifications x (git fetch + index-pack) x gitMemoryMb + 512 MiB.
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 7168Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Plain environment variables for the api, name: value. CONSOLE_ORIGIN is
  # the console's public origin; Slack's redirect and events addresses are
  # computed from it (docs/operator/api-server.md). Unset, Slack accounts
  # cannot be linked and an install leaves the app without an event
  # subscription (events_url_unset).
  # When this Ingress is in-house and Slack's events enter on a separate
  # internet-facing entrance routing just /v1/slack/events and
  # /v1/slack/interactions, an owner saves that entrance's https base in
  # Settings > Integrations > Slack; it is not an environment variable.
  #   extraEnv:
  #     CONSOLE_ORIGIN: https://werft.example.com
  extraEnv: {}

# One replica, replaced with Recreate: a second scheduler never gets the
# pass lock, so its health goes stale and liveness restarts it in a loop.
scheduler:
  enabled: true
  terminationGracePeriodSeconds: 45
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  intervalSec: 5
  maxConsecutiveFailures: 3
  # Above intervalSec + passTimeoutSec.
  healthStaleSec: 200
  passTimeoutSec: 180
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

# Passes are re-judged under row locks, so no leader election is needed;
# one replica is enough.
reconciler:
  replicas: 1
  terminationGracePeriodSeconds: 20
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  intervalSec: 10
  passTimeoutSec: 60
  maxConsecutiveFailures: 3
  healthStaleSec: 90
  batchSize: 100
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

# Drains the Slack inbox, claiming rows for leaseSec at a time; one replica
# is enough. It loads the api's catalog.
slack:
  enabled: true
  replicas: 1
  # Above the role's 10s stop grace.
  terminationGracePeriodSeconds: 20
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  intervalSec: 2
  passTimeoutSec: 60
  maxConsecutiveFailures: 3
  # Above intervalSec + passTimeoutSec.
  healthStaleSec: 90
  batchSize: 10
  leaseSec: 60
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

egressProxy:
  replicas: 2
  # 512 MiB credential bodies + 64 MiB response queues + 2048 MiB forward
  # queues + 256 MiB Bun = 2880 MiB, under this.
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 3072Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

# A pre-install/pre-upgrade hook: the schema is migrated before any new pod
# of the release starts.
migrate:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# The platform metrics (apps/docs/content/docs/run-server/self-hosting/operate/metrics.mdx): GET /metrics on port 9464
# in the Prometheus text format, computed from the database at each scrape.
# Off by default. One replica, replaced with Recreate: every replica would
# report the same installation-wide totals, so a second one is a duplicate
# scrape target. It gets the scheduler's config.limits, so its launch queue
# is the one the scheduler drains.
metrics:
  enabled: false
  port: 9464
  # How the collector finds the Pod: Prometheus annotations, or a Datadog
  # Agent openmetrics check under ad.datadoghq.com/metrics.checks
  # (apps/docs/content/docs/run-server/self-hosting/operate/metrics.mdx). For example:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port: "9464"
  podAnnotations: {}
  terminationGracePeriodSeconds: 20
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

# The pre-upgrade check (templates/upgrade-check-job.yaml): an upgrade that
# changes the worker image, or drops or replaces the previous image deployed
# now, stops unless every session it would leave with no image to resume on
# is listed here, exactly the list the check prints.
upgrade:
  approvedSessions: []
  activeDeadlineSeconds: 300
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# Must not run while a backup is being taken (docs/operator/backup-restore.md).
checkpointGc:
  enabled: true
  schedule: "0 4 * * 0"
  dryRun: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []

# Moves events of sessions idle longer than afterDays into held objects under
# session-archive/ (docs/operator/data-retention.md). afterDays is 0 (off) or
# 30–3650. Counts only until dryRun is false. Runs only with
# CHECKPOINT_OBJECT_PROTECTION=locked. Must not run while a backup is being
# taken (docs/operator/backup-restore.md).
sessionArchive:
  enabled: true
  schedule: "0 5 * * 0"
  afterDays: 180
  dryRun: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []

# Settings the scheduler hands the worker Pods it launches.
worker:
  # StorageClass of workspace PVCs; empty is the cluster default.
  storageClass: ""
  # A dedicated node group, e.g. with podPidsLimit set on its kubelet.
  nodeSelector: {}
  tolerations: []
  cpus: 1
  # Requests equal limits on worker pods; sized so a resumed engine holding
  # a transcript at the 512 MiB checkpoint limit stays under half of it.
  # Sessions per node and how to trade them off: apps/docs/content/docs/run-server/self-hosting/operate/capacity.mdx.
  memoryMb: 4608
  # Node disk a worker may use outside its PVC (mostly its log), request
  # and limit both; past it the kubelet evicts the Pod.
  ephemeralStorageMb: 1024
  workspace:
    quotaMb: 4096
    gcMinAgeSec: 3600
    # Declares that storage hard-enforces the requested bytes for every workspace
    # PVC in this installation, including existing PVCs. With an empty storageClass,
    # the cluster default applies: verify enforcement for each PVC. Werft does not
    # verify it. The declaration path leaves inode enforcement unknown.
    enforcedByStorage: false

# A throwaway preview install, never a real one. true gives the api
# PREVIEW_NAMESPACE (its own namespace), and the demo-accounts and demo-data
# CLIs then run in the api Pod, but only while DATABASE_URL is that
# namespace's `postgres` Service: the demo accounts' password is public.
# render-check.ts fails the AWS example if it turns this on.
preview:
  enabled: false

service:
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: agent-platform.example.com
  tls: []
  console:
    # Routes "/" (the web console the api serves) and answers /internal with
    # an ALB fixed-response 404 ahead of it; needs className alb. Read
    # the Kubernetes install page of the docs site (operate/kubernetes-deployment) before turning it on.
    enabled: false

networkPolicy:
  enabled: true
  api:
    # Peers allowed to reach the public port 3000 besides the egress proxy
    # (NetworkPolicy `from` entries). Empty allows any source: the Ingress
    # controller or load balancer reaches pods from outside the namespace.
    ingressFrom: []
  worker:
    # Workers reach the gateway through the egress proxy, whose NO_PROXY
    # names only localhost and the proxy, so they need no direct route.
    allowDirectGateway: false
  slack:
    # The PostgreSQL port slack's egress may reach, on any address.
    databasePort: 5432
  metrics:
    # Peers allowed to scrape the metrics port (NetworkPolicy `from`
    # entries), e.g. the collector's namespace. Empty allows any source, as
    # api.ingressFrom does: collectors often run outside the namespace. The
    # metrics carry counts and tool and model names, no ids or secrets.
    ingressFrom: []
